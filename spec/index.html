<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Specialization Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F3F7; --surface:#FFFFFF; --surface-2:#F8F7FB; --ink:#17151F; --muted:#5E5A6E; --faint:#8C889B;
  --line:#E2DFEA; --line-strong:#CBC6D8; --accent:#57068C; --accent-soft:#EFE6F7; --accent-ink:#FFFFFF;
  --good:#1D7A4D; --good-bg:#E3F4EA; --mid:#6B5E00; --mid-bg:#F6F0CF; --warn:#A23B1C; --warn-bg:#FBE6DE;
  --taken:#57068C; --planned:#B99AD6; --bar-bg:#ECE9F2;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121019; --surface:#1B1824; --surface-2:#211E2C; --ink:#ECE9F4; --muted:#A9A3BA; --faint:#7C768E;
    --line:#2D2939; --line-strong:#3E394D; --accent:#B98AE6; --accent-soft:#2C2240; --accent-ink:#17121F;
    --good:#6FD39E; --good-bg:#16311F; --mid:#E4CF6A; --mid-bg:#302B12; --warn:#F09A7C; --warn-bg:#3A1C13;
    --taken:#B98AE6; --planned:#5E4680; --bar-bg:#2D2939;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121019; --surface:#1B1824; --surface-2:#211E2C; --ink:#ECE9F4; --muted:#A9A3BA; --faint:#7C768E;
  --line:#2D2939; --line-strong:#3E394D; --accent:#B98AE6; --accent-soft:#2C2240; --accent-ink:#17121F;
  --good:#6FD39E; --good-bg:#16311F; --mid:#E4CF6A; --mid-bg:#302B12; --warn:#F09A7C; --warn-bg:#3A1C13;
  --taken:#B98AE6; --planned:#5E4680; --bar-bg:#2D2939;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding:0 16px 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:12.5px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:16px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-variant-numeric:tabular-nums}
.stat b{font-size:16px}
.stat span{color:var(--muted);font-size:12px}
.stat.over b{color:var(--warn)}

.layout{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:24px;padding-top:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:14px;font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}

/* picker */
.picker{position:sticky;top:84px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
@media (max-width:900px){.picker{position:static;max-height:none}.list{max-height:60vh}header.top{position:static}}
.pick-controls{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pick-controls input[type=search],.pick-controls select,.addrow input{width:100%;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:12.5px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{overflow:auto;flex:1;min-height:200px}
.course{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.course:last-child{border-bottom:0}
.course .code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.course .title{font-weight:500}
.course .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.course.sel-t{background:color-mix(in srgb,var(--taken) 8%,transparent)}
.course.sel-p{background:color-mix(in srgb,var(--planned) 12%,transparent)}
.state{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;align-self:start}
.state button{border:0;background:transparent;padding:3px 8px;cursor:pointer;font-size:12px;color:var(--muted)}
.state button+button{border-left:1px solid var(--line)}
.state button[aria-pressed=true][data-s=p]{background:var(--planned);color:#17121F}
.state button[aria-pressed=true][data-s=t]{background:var(--taken);color:var(--accent-ink)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.term{font-family:var(--mono)}
.tag.core{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.sp{border-color:transparent;background:var(--bar-bg);color:var(--ink)}
.cred{font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;border-bottom:1px dashed var(--line-strong)}
.cred input{width:46px;font-size:12px;padding:1px 4px}
.addrow{display:grid;grid-template-columns:1fr 1.4fr 60px auto;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}

/* results */
.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.best{padding:14px}
.best h2{margin:0 0 4px;font-size:16px}
.combo{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--surface-2)}
.combo-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.alloc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.alloc .col{min-width:0}
.alloc h4{margin:0 0 4px;font-size:13px}
.alloc ul{margin:0;padding:0;list-style:none;font-size:12.5px}
.alloc li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}
.alloc li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.t{background:var(--taken)} .dot.p{background:var(--planned)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.badge.ok{background:var(--good-bg);color:var(--good)}
.badge.plan{background:var(--mid-bg);color:var(--mid)}
.badge.no{background:var(--warn-bg);color:var(--warn)}
.badge.n{background:var(--bar-bg);color:var(--muted)}

.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.spec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.spec.target{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.spec-h{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.spec-h h3{margin:0;font-size:14px;font-weight:600}
.bar{position:relative;height:8px;border-radius:4px;background:var(--bar-bg);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0}
.bar i.t{background:var(--taken)} .bar i.p{background:var(--planned)}
.groups{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.grp{display:flex;justify-content:space-between;gap:8px}
.grp .ok{color:var(--good)} .grp .no{color:var(--warn)}
.spec .why{font-size:12px;color:var(--warn)}
.spec .note{font-size:12px;color:var(--muted)}
.spec details summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
.spec details ul{margin:6px 0 0;padding-left:16px;font-size:12.5px}
.spec details li{margin:2px 0}
.tgt{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer}
.filters-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.foot{margin-top:24px;color:var(--faint);font-size:12px;line-height:1.6}
.empty{padding:20px 14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <h1>Specialization planner</h1>
    <div class="sub">Tech MBA · rules from the NYU Bulletin 2026–27 · <a href="../">Spring 2027 courses</a> · <a href="../tmi/">TMI courses</a></div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="layout">
  <section class="panel picker" aria-label="Courses">
    <div class="pick-controls">
      <input type="search" id="q" placeholder="Search code or title…" aria-label="Search courses">
      <div class="row">
        <select id="fspec" aria-label="Filter by specialization" style="flex:1"></select>
      </div>
      <div class="row" style="justify-content:space-between">
        <div class="seg" id="fshow" role="group" aria-label="Show">
          <button data-v="all" aria-pressed="true">All</button>
          <button data-v="mine" aria-pressed="false">Mine</button>
          <button data-v="S27" aria-pressed="false">Spring 27</button>
          <button data-v="Su26" aria-pressed="false">Summer</button>
        </div>
        <button class="linkbtn" id="importStars" title="Mark the sections you starred on the Spring 2027 page as Planned">Import ★ Spring</button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <form class="addrow" id="addForm" autocomplete="off">
      <input id="addCode" placeholder="FINC-GB 3331" aria-label="Course code" required>
      <input id="addTitle" placeholder="Title (optional)" aria-label="Title">
      <input id="addCred" type="number" step="0.5" min="0.5" max="6" value="3" aria-label="Credits">
      <button class="btn" type="submit">Add</button>
    </form>
  </section>

  <section class="results">
    <div class="panel best" id="best"></div>
    <div class="filters-row">
      <h2 style="margin:0;font-size:15px">All specializations</h2>
      <div class="row">
        <label class="tgt"><input type="checkbox" id="countCore"> Count Tech MBA core courses</label>
        <div class="seg" id="sortSeg" role="group" aria-label="Sort">
          <button data-v="progress" aria-pressed="true">By progress</button>
          <button data-v="name" aria-pressed="false">A–Z</button>
        </div>
      </div>
    </div>
    <div class="specs" id="specs"></div>
  </section>
</div>

<div class="foot" id="foot"></div>
</div>

  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const KEY = 'stern27.spec.v1';
const ST = Object.assign({states:{}, credits:{}, custom:[], targets:[], countCore:true, coreInit:false}, store.get(KEY, {}));
const save = () => store.set(KEY, ST);
ST.custom.forEach(c => { if (!CAT[c.code]) CAT[c.code] = {t:c.title||'', u:c.credits, off:[], custom:1}; });
if (!ST.coreInit) { Object.keys(CAT).forEach(c => { if (CAT[c].core && !ST.states[c]) ST.states[c] = 'p'; }); ST.coreInit = true; save(); }

const credits = c => ST.credits[c] ?? CAT[c]?.u ?? 3;
const subj = c => c.split(' ')[0];

/* eligibility: spec index -> list of group ids for a course */
function groupsFor(spec, code){
  const out = [];
  spec.groups.forEach((g,i) => { if (g.codes.includes(code) || g.prefix.some(p => code.startsWith(p+' '))) out.push(i); });
  return out;
}
const ELIG = {}; // code -> [{s, gs}]
function eligOf(code){
  if (!ELIG[code]) ELIG[code] = SPECS.map((s,si) => ({s:si, gs:groupsFor(s, code)})).filter(x => x.gs.length);
  return ELIG[code];
}
const specsOf = code => eligOf(code).map(x => SPECS[x.s].name);

/* ---------- solver ---------- */
// course item: {code, cr, st:'t'|'p'}
function ruleState(spec){ return spec.rules.map(() => 0); }
function ruleHit(r, code){
  if (r.type==='maxPerSubject') return true;
  return (r.codes||[]).includes(code) || (r.prefix||[]).some(p => code.startsWith(p+' '));
}
function canAdd(spec, acc, gi, it){
  const g = spec.groups[gi];
  if (g.max != null && acc.g[gi] + it.cr > g.max + 1e-9) return false;
  for (let i=0;i<spec.rules.length;i++){
    const r = spec.rules[i];
    if (r.type==='maxFrom' && ruleHit(r,it.code) && acc.r[i] + it.cr > r.max + 1e-9) return false;
    if (r.type==='maxCount' && ruleHit(r,it.code) && acc.r[i] + 1 > r.max) return false;
    if (r.type==='maxPerSubject' && ((acc.subj[subj(it.code)]||0) + it.cr > r.max + 1e-9)) return false;
  }
  return true;
}
function doAdd(spec, acc, gi, it, sign){
  acc.g[gi] += sign*it.cr; acc.sum += sign*it.cr;
  spec.rules.forEach((r,i) => {
    if (r.type==='maxFrom' && ruleHit(r,it.code)) acc.r[i] += sign*it.cr;
    if (r.type==='maxCount' && ruleHit(r,it.code)) acc.r[i] += sign;
    if (r.type==='minPrefix' && it.code.startsWith(r.prefix+' ')) acc.r[i] += sign*it.cr;
  });
  const s = subj(it.code); acc.subj[s] = (acc.subj[s]||0) + sign*it.cr;
}
function deficit(spec, acc){
  let gd = 0;
  spec.groups.forEach((g,i) => { gd += Math.max(0, g.min - acc.g[i]); });
  let pd = 0;
  spec.rules.forEach((r,i) => { if (r.type==='minPrefix') pd = Math.max(pd, r.min - acc.r[i]); });
  return Math.max(spec.total - acc.sum, gd, pd, 0);
}
const newAcc = spec => ({g:spec.groups.map(()=>0), r:ruleState(spec), sum:0, subj:{}});

// best single-spec allocation (min deficit, then prefer taken courses, then fewer credits)
function bestFor(si, items){
  const spec = SPECS[si];
  const cand = items.map(it => ({it, gs: groupsFor(spec, it.code)})).filter(x => x.gs.length)
                    .sort((a,b) => (a.it.st===b.it.st ? b.it.cr-a.it.cr : a.it.st==='t'?-1:1));
  const acc = newAcc(spec), pick = [];
  let best = {def: deficit(spec, acc), score: 0, pick: []}, nodes = 0;
  const remain = []; let r = 0; for (let i=cand.length-1;i>=0;i--){ r += cand[i].it.cr; remain[i] = r; }
  const score = () => pick.reduce((s,p) => s + (p.it.st==='t'?1000:0) - p.it.cr, 0);
  (function dfs(k){
    if (++nodes > 60000) return;
    const d = deficit(spec, acc);
    if (d < best.def - 1e-9 || (Math.abs(d-best.def) < 1e-9 && score() > best.score)) best = {def:d, score:score(), pick: pick.slice()};
    if (k >= cand.length || d === 0) return;
    if (d - remain[k] > best.def + 1e-9) return;
    const c = cand[k];
    for (const gi of c.gs){
      if (!canAdd(spec, acc, gi, c.it)) continue;
      doAdd(spec, acc, gi, c.it, 1); pick.push({it:c.it, gi});
      dfs(k+1);
      pick.pop(); doAdd(spec, acc, gi, c.it, -1);
    }
    dfs(k+1);
  })(0);
  if (best.def < 1e-9) best.pick = trim(best.pick.map(p => ({...p, si}))).map(({it,gi}) => ({it,gi}));
  const fin = newAcc(spec); best.pick.forEach(p => doAdd(spec, fin, p.gi, p.it, 1));
  return {si, def: best.def, pick: best.pick, acc: fin, complete: best.def < 1e-9 && prereqOk(spec)};
}
function prereqOk(spec){
  return spec.prereq.every(p => p.ok === false ? false : !p.codes.length || p.codes.some(c => ST.states[c] || (CAT[c]?.core && ST.countCore)));
}

// joint feasibility for a set of specs; each course used once
function solveCombo(sis, items){
  const specs = sis.map(i => SPECS[i]);
  const accs = specs.map(newAcc);
  const cand = items.map(it => ({it, opts: sis.flatMap((si,k) => groupsFor(SPECS[si], it.code).map(gi => ({k, gi})))}))
                    .filter(x => x.opts.length)
                    .sort((a,b) => a.opts.length - b.opts.length || (a.it.st===b.it.st?0:a.it.st==='t'?-1:1));
  const remainFor = specs.map(() => []);
  for (let k=0;k<specs.length;k++){ let r=0; for (let i=cand.length-1;i>=0;i--){ if (cand[i].opts.some(o=>o.k===k)) r += cand[i].it.cr; remainFor[k][i] = r; } }
  const pick = []; let found = null, nodes = 0;
  (function dfs(i){
    if (found || ++nodes > 150000) return;
    const defs = specs.map((s,k) => deficit(s, accs[k]));
    if (defs.every(d => d < 1e-9)) { found = pick.slice(); return; }
    if (i >= cand.length) return;
    for (let k=0;k<specs.length;k++) if (defs[k] > remainFor[k][i] + 1e-9) return;
    const c = cand[i];
    for (const o of c.opts){
      if (defs[o.k] < 1e-9) continue;
      if (!canAdd(specs[o.k], accs[o.k], o.gi, c.it)) continue;
      doAdd(specs[o.k], accs[o.k], o.gi, c.it, 1); pick.push({it:c.it, si:sis[o.k], gi:o.gi});
      dfs(i+1);
      pick.pop(); doAdd(specs[o.k], accs[o.k], o.gi, c.it, -1);
      if (found) return;
    }
    dfs(i+1);
  })(0);
  return found ? trim(found) : null;
}
function combos(arr, k){ const out=[]; (function r(s,cur){ if(cur.length===k){out.push(cur.slice());return;} for(let i=s;i<arr.length;i++){cur.push(arr[i]);r(i+1,cur);cur.pop();} })(0,[]); return out; }
function bestCombos(items, singles){
  const ok = singles.filter(x => x.complete).map(x => x.si);
  for (let k=Math.min(META.maxSpecs, ok.length); k>=1; k--){
    const found = [];
    for (const c of combos(ok, k)){ const a = solveCombo(c, items); if (a) found.push({sis:c, alloc:a}); }
    if (found.length) return found;
  }
  return [];
}

// drop surplus courses (smallest, planned first) while every spec stays complete
function trim(alloc){
  const out = alloc.slice();
  const order = out.slice().sort((a,b) => (a.it.st===b.it.st ? a.it.cr-b.it.cr : a.it.st==='p'?-1:1));
  for (const x of order){
    const si = x.si, spec = SPECS[si], rest = out.filter(y => y !== x && y.si === si);
    const acc = newAcc(spec); rest.forEach(y => doAdd(spec, acc, y.gi, y.it, 1));
    if (deficit(spec, acc) < 1e-9) out.splice(out.indexOf(x), 1);
  }
  return out;
}

/* ---------- build items ---------- */
function itemsFor(includePlanned){
  return Object.entries(ST.states)
    .filter(([c,s]) => CAT[c] && (s==='t' || (includePlanned && s==='p')))
    .filter(([c]) => ST.countCore || !CAT[c].core)
    .map(([c,s]) => ({code:c, cr:credits(c), st:s}));
}

/* ---------- picker ---------- */
const listEl = document.getElementById('list');
const P = {q:'', spec:'', show:'all'};
const fspec = document.getElementById('fspec');
fspec.innerHTML = `<option value="">All specializations</option>` + SPECS.map((s,i) => `<option value="${i}">${esc(s.name)}</option>`).join('');
const ALL_CODES = Object.keys(CAT).sort((a,b) => (CAT[a].core?1:0)-(CAT[b].core?1:0) || a.localeCompare(b));

function courseRow(c){
  const x = CAT[c], s = ST.states[c] || '';
  const sp = specsOf(c);
  const off = x.core ? '' : x.off.length ? x.off.map(t => `<span class="tag term">${TERM_LABEL[t]}</span>`).join('') : `<span class="tag faint" title="Not on the Summer 2026 / Fall 2026 / Spring 2027 lists">not offered 26–27</span>`;
  return `<div class="course ${s?'sel-'+s:''}" data-code="${esc(c)}">
    <div><div class="code">${esc(c)} · <span class="cred" data-cred="${esc(c)}" title="Click to edit credits">${fmt(credits(c))} cr</span></div><div class="title">${esc(x.t||'—')}</div></div>
    <div class="state" role="group" aria-label="Status for ${esc(c)}">
      <button data-s="p" aria-pressed="${s==='p'}">Plan</button><button data-s="t" aria-pressed="${s==='t'}">Taken</button>
    </div>
    <div class="meta">${x.core?'<span class="tag core">Core</span>':''}${x.custom?'<span class="tag">Custom</span>':''}${off}${sp.map(n => `<span class="tag sp">${esc(n)}</span>`).join('')}${!sp.length && !x.core ? '<span class="tag faint">no specialization</span>' : ''}</div>
  </div>`;
}
function renderList(){
  const q = P.q.trim().toLowerCase();
  const si = P.spec === '' ? null : +P.spec;
  const rows = ALL_CODES.filter(c => {
    const x = CAT[c];
    if (q && !(c.toLowerCase().includes(q) || c.replace(' ','').toLowerCase().includes(q.replace(/[\s.]/g,'')) || (x.t||'').toLowerCase().includes(q))) return false;
    if (si != null && !groupsFor(SPECS[si], c).length) return false;
    if (P.show === 'mine' && !ST.states[c]) return false;
    if ((P.show === 'S27' || P.show === 'Su26') && !x.off.includes(P.show)) return false;
    return true;
  });
  listEl.innerHTML = rows.length ? rows.map(courseRow).join('') : `<div class="empty">No courses match. ${si!=null && SPECS[si].groups.some(g=>g.prefix.length)?'This specialization also accepts any '+esc(SPECS[si].groups.flatMap(g=>g.prefix).join(' / '))+' course — add it below.':''}</div>`;
}
listEl.addEventListener('click', e => {
  const b = e.target.closest('.state button');
  if (b){
    const c = b.closest('.course').dataset.code, s = b.dataset.s;
    if (ST.states[c] === s) delete ST.states[c]; else ST.states[c] = s;
    save(); renderList(); renderResults(); return;
  }
  const cr = e.target.closest('.cred');
  if (cr && !cr.querySelector('input')){
    const c = cr.dataset.cred;
    cr.innerHTML = `<input type="number" step="0.25" min="0.5" max="6" value="${credits(c)}" aria-label="Credits for ${esc(c)}">`;
    const inp = cr.querySelector('input'); inp.focus(); inp.select();
    const done = () => { const v = parseFloat(inp.value); if (v>0 && v!==CAT[c].u) ST.credits[c] = v; else delete ST.credits[c]; save(); renderList(); renderResults(); };
    inp.addEventListener('blur', done); inp.addEventListener('keydown', ev => { if (ev.key==='Enter') inp.blur(); if (ev.key==='Escape'){ inp.value = credits(c); inp.blur(); } });
  }
});
document.getElementById('q').addEventListener('input', e => { P.q = e.target.value; renderList(); });
fspec.addEventListener('change', e => { P.spec = e.target.value; renderList(); });
document.getElementById('fshow').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  P.show = b.dataset.v; e.currentTarget.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x===b)); renderList();
});
document.getElementById('importStars').addEventListener('click', () => {
  const stars = store.get('stern27.stars2', []); let n = 0;
  (Array.isArray(stars)?stars:[]).forEach(k => { const c = D.springNbr[String(k)]; if (c && CAT[c] && !ST.states[c]) { ST.states[c] = 'p'; n++; } });
  save(); renderList(); renderResults();
  const b = document.getElementById('importStars'); b.textContent = n ? `Imported ${n}` : 'Nothing new to import'; setTimeout(() => b.textContent = 'Import ★ Spring', 2200);
});
document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  let code = document.getElementById('addCode').value.trim().toUpperCase().replace('.', ' ').replace(/\s+/g,' ');
  const m = code.match(/^([A-Z0-9]+-[A-Z]{2})\s?(\w+)$/); if (!m) { document.getElementById('addCode').setCustomValidity('Use a code like FINC-GB 3331'); document.getElementById('addCode').reportValidity(); return; }
  code = m[1]+' '+m[2];
  const title = document.getElementById('addTitle').value.trim(), cr = parseFloat(document.getElementById('addCred').value) || 3;
  if (!CAT[code]) { CAT[code] = {t:title, u:cr, off:[], custom:1}; ST.custom.push({code, title, credits:cr}); ALL_CODES.unshift(code); delete ELIG[code]; }
  else if (cr !== CAT[code].u) ST.credits[code] = cr;
  ST.states[code] = ST.states[code] || 'p';
  save(); e.target.reset(); document.getElementById('addCred').value = 3; P.show = 'mine';
  document.querySelectorAll('#fshow button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v==='mine'));
  renderList(); renderResults();
});
document.getElementById('addCode').addEventListener('input', e => e.target.setCustomValidity(''));

/* ---------- results ---------- */
const cc = document.getElementById('countCore');
cc.checked = ST.countCore;
cc.addEventListener('change', () => { ST.countCore = cc.checked; save(); renderResults(); });
let SORT = 'progress';
document.getElementById('sortSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  SORT = b.dataset.v; e.currentTarget.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x===b)); renderResults();
});

function allocHtml(alloc, sis){
  return `<div class="alloc">${sis.map(si => {
    const s = SPECS[si], rows = alloc.filter(a => a.si === si);
    const tot = rows.reduce((t,a) => t + a.it.cr, 0);
    return `<div class="col"><h4>${esc(s.name)} <span class="faint mono">${fmt(tot)} cr</span></h4><ul>${rows.map(a =>
      `<li><span title="${esc(CAT[a.it.code].t)}"><i class="dot ${a.it.st}"></i>${esc(a.it.code)} <span class="faint">${esc(s.groups[a.gi].label)}</span></span><span class="mono faint">${fmt(a.it.cr)}</span></li>`).join('')}</ul></div>`;
  }).join('')}</div>`;
}

function renderResults(){
  const itT = itemsFor(false), itP = itemsFor(true);
  const singT = SPECS.map((_,i) => bestFor(i, itT));
  const singP = SPECS.map((_,i) => bestFor(i, itP));

  /* stats */
  const sumBy = (st, core) => Object.entries(ST.states).filter(([c,s]) => CAT[c] && (st==='all' || s===st) && (core==null || !!CAT[c].core===core)).reduce((t,[c]) => t + credits(c), 0);
  const elect = sumBy('all', false), tot = sumBy('all', null);
  const okT = singT.filter(x=>x.complete).length, okP = singP.filter(x=>x.complete).length;
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${fmt(sumBy('t',null))}</b><span>cr taken</span></div>` +
    `<div class="stat"><b>${fmt(tot)}</b><span>/ ${META.totalCredits} cr total</span></div>` +
    `<div class="stat ${elect > META.electiveCredits ? 'over':''}" title="Tech MBA electives budget"><b>${fmt(elect)}</b><span>/ ${META.electiveCredits} elective cr</span></div>`;

  /* best combination */
  const targets = ST.targets.filter(n => SPECS.some(s => s.name===n));
  const tsis = targets.map(n => SPECS.findIndex(s => s.name===n));
  let html = '';
  if (tsis.length){
    const allok = tsis.every(i => singP[i].complete);
    const a = allok ? solveCombo(tsis, itP) : null;
    const aT = a && tsis.every(i => singT[i].complete) ? solveCombo(tsis, itT) : null;
    html += `<h2>Your target set</h2><div class="muted small">${tsis.map(i => esc(SPECS[i].name)).join(' + ')}</div>`;
    if (a) html += `<div class="combo"><div class="combo-h">${aT ? '<span class="badge ok">✓ Declarable with taken courses</span>' : '<span class="badge plan">✓ Declarable with your plan</span>'}</div>${allocHtml(aT||a, tsis)}</div>`;
    else {
      const short = tsis.filter(i => !singP[i].complete);
      html += `<div class="combo"><span class="badge no">Not yet</span> <span class="small muted">${short.length ? 'Short on: ' + short.map(i => `${esc(SPECS[i].name)} (${fmt(singP[i].def)} cr)`).join(', ') : 'Each one works alone, but your courses can’t cover all of them at once — a course counts toward only one specialization. Add more eligible courses.'}</span></div>`;
    }
    html += `<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">`;
  }
  const bc = bestCombos(itP, singP);
  if (!bc.length) {
    html += `<h2>No specialization complete yet</h2><div class="muted small">Mark courses as Plan or Taken on the left. Closest: ${singP.slice().sort((a,b)=>a.def-b.def).slice(0,3).map(x => `${esc(SPECS[x.si].name)} (needs ${fmt(x.def)} cr)`).join(', ')}.</div>`;
  } else {
    const k = bc[0].sis.length;
    const scored = bc.map(c => ({...c, secured: c.sis.every(i => singT[i].complete) && !!solveCombo(c.sis, itT)}))
                     .sort((a,b) => (b.secured-a.secured));
    html += `<h2>You can declare ${k} specialization${k>1?'s':''}${k<META.maxSpecs?'':' (the maximum)'}</h2>
      <div class="muted small">Up to ${META.maxSpecs} specializations, 9 credits each; a course counts toward only one. ${bc.length>1?`${bc.length} combinations work — showing ${Math.min(4,bc.length)}.`:''}</div>`;
    scored.slice(0,4).forEach(c => {
      html += `<div class="combo"><div class="combo-h">${c.secured?'<span class="badge ok">Secured by taken courses</span>':'<span class="badge plan">Relies on planned courses</span>'}${c.sis.map(i => `<b>${esc(SPECS[i].name)}</b>`).join('<span class="faint">+</span>')}</div>${allocHtml(c.alloc, c.sis)}</div>`;
    });
  }
  html += `<div class="small faint" style="margin-top:10px"><i class="dot t"></i>taken <i class="dot p" style="margin-left:10px"></i>planned · ★ a card below to set a target combination</div>`;
  document.getElementById('best').innerHTML = html;

  /* spec cards */
  let order = SPECS.map((_,i) => i);
  if (SORT === 'progress') order.sort((a,b) => (singP[a].def - singP[b].def) || (singT[a].def - singT[b].def) || SPECS[a].name.localeCompare(SPECS[b].name));
  document.getElementById('specs').innerHTML = order.map(i => {
    const s = SPECS[i], t = singT[i], p = singP[i];
    const tCr = Math.min(s.total, t.acc.sum), pCr = Math.min(s.total, p.acc.sum);
    const status = t.complete ? '<span class="badge ok">✓ Complete</span>' : p.complete ? '<span class="badge plan">On track</span>' : pCr > 0 ? `<span class="badge no">${fmt(p.def)} cr short</span>` : '<span class="badge n">Not started</span>';
    const groups = s.groups.map((g,gi) => {
      const v = p.acc.g[gi], need = g.min, ok = v >= need - 1e-9;
      const range = g.max == null ? (need ? `≥${fmt(need)}` : 'any') : (need===g.max ? fmt(need) : `${fmt(need)}–${fmt(g.max)}`);
      return `<div class="grp"><span>${esc(g.label)}</span><span class="mono ${need? (ok?'ok':'no') : ''}">${fmt(v)} / ${range}</span></div>`;
    }).join('');
    const rules = s.rules.map((r,ri) => {
      if (r.type==='minPrefix'){ const v = p.acc.r[ri], ok = v >= r.min-1e-9; return `<div class="grp"><span>${esc(r.text)}</span><span class="mono ${ok?'ok':'no'}">${fmt(v)} / ≥${r.min}</span></div>`; }
      return `<div class="note">• ${esc(r.text)}</div>`;
    }).join('');
    const pre = s.prereq.map(pq => { const ok = pq.ok !== false && (!pq.codes.length || pq.codes.some(c => ST.states[c] || (CAT[c]?.core && ST.countCore))); return `<div class="${ok?'note':'why'}">${ok?'✓':'⚠'} ${esc(pq.text)}</div>`; }).join('');
    const used = new Set(p.pick.map(x => x.it.code));
    const pickList = p.pick.map(x => `<li><i class="dot ${x.it.st}"></i>${esc(x.it.code)} ${esc(CAT[x.it.code].t)} <span class="faint">· ${esc(s.groups[x.gi].label)} · ${fmt(x.it.cr)}</span></li>`).join('');
    // suggestions: eligible, not chosen, offered in an upcoming term
    const deficitGroups = s.groups.map((g,gi) => ({gi, short: g.min - p.acc.g[gi]})).filter(x => x.short > 1e-9).map(x => x.gi);
    const sugg = ALL_CODES.filter(c => !ST.states[c] && !used.has(c) && CAT[c].off.includes('S27'))
      .map(c => ({c, gs: groupsFor(s, c)})).filter(x => x.gs.length)
      .sort((a,b) => (deficitGroups.some(g=>b.gs.includes(g)) - deficitGroups.some(g=>a.gs.includes(g))))
      .slice(0, 8);
    const isT = targets.includes(s.name);
    return `<article class="spec ${isT?'target':''}">
      <div class="spec-h"><h3>${esc(s.name)}</h3><div class="row" style="gap:6px">${status}<label class="tgt" title="Add to target combination (max ${META.maxSpecs})"><input type="checkbox" data-target="${esc(s.name)}" ${isT?'checked':''}>★</label></div></div>
      <div class="bar" role="img" aria-label="${fmt(pCr)} of ${s.total} credits with plan, ${fmt(tCr)} taken"><i class="p" style="width:${pCr/s.total*100}%"></i><i class="t" style="width:${tCr/s.total*100}%"></i></div>
      <div class="small muted mono">${fmt(tCr)} taken · ${fmt(pCr)} with plan / ${s.total} cr</div>
      <div class="groups">${groups}${rules}</div>
      ${pre}
      ${s.notes.map(n => `<div class="note">${esc(n)}</div>`).join('')}
      ${s.termAdded ? `<div class="note">Also counted from the term lists (not in the bulletin list): ${s.termAdded.map(esc).join(', ')}.</div>` : ''}
      ${p.pick.length ? `<details><summary>Counted courses (${p.pick.length})</summary><ul>${pickList}</ul></details>` : ''}
      ${!p.complete && sugg.length ? `<details><summary>Spring 2027 options</summary><ul>${sugg.map(x => `<li><a href="#" data-plan="${esc(x.c)}">+ ${esc(x.c)}</a> ${esc(CAT[x.c].t)} <span class="faint">· ${x.gs.map(g=>esc(s.groups[g].label)).join('/')} · ${fmt(credits(x.c))}</span></li>`).join('')}</ul></details>` : ''}
      <div><button class="linkbtn" data-filter="${i}">Show all eligible courses →</button></div>
    </article>`;
  }).join('');
}
document.getElementById('specs').addEventListener('click', e => {
  const f = e.target.closest('[data-filter]');
  if (f){ P.spec = f.dataset.filter; fspec.value = P.spec; P.show='all'; document.querySelectorAll('#fshow button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v==='all')); renderList(); document.querySelector('.picker').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  const pl = e.target.closest('[data-plan]');
  if (pl){ e.preventDefault(); ST.states[pl.dataset.plan] = 'p'; save(); renderList(); renderResults(); }
});
document.getElementById('specs').addEventListener('change', e => {
  const t = e.target.closest('[data-target]'); if (!t) return;
  const n = t.dataset.target;
  if (t.checked){ if (ST.targets.length >= META.maxSpecs) { t.checked = false; return; } ST.targets.push(n); }
  else ST.targets = ST.targets.filter(x => x !== n);
  save(); renderResults();
});

document.getElementById('foot').innerHTML =
  `Rules: <a href="https://bulletins.nyu.edu/graduate/business/programs/technology-entrepreneurship-mba/" target="_blank" rel="noopener">NYU Bulletin — Technology &amp; Entrepreneurship MBA</a> (specialization requirements) and <a href="https://www.stern.nyu.edu/portal-partners/academic-affairs-advising/specializations" target="_blank" rel="noopener">Stern specializations policy</a> (up to ${META.maxSpecs} specializations, 9 credits each, a course counts toward only one). ` +
  `Offerings (Su26 / F26 / S27) and a few extra eligible courses come from Stern's term specialization lists. ` +
  `Credits default to Stern's numbering convention (x1xx = 1.5, x3xx = 3) or the Spring schedule — click any credit value to change it. ` +
  `The bulletin's "not eligible if taken as core" exclusions apply to full-time two-year students only, so Tech MBA core courses count by default (toggle above). ` +
  `This is a planning aid, not an official audit — confirm in MAP / with Academic Affairs before declaring.`;

renderList(); renderResults();
})();
</script>
</body>
