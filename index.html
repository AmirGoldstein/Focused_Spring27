sion to license Spotify and how we set the pricing for the entire subscription industry. • Piracy - it's history, impact and ways governments are trying to counteract it • The future - if there is one? • In the end, you'll have a very clear understanding of the industry, how it makes money, it's challenges and opportunities.","prerequisites":["Prerequisite: INTA-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1859,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"03/24-04/28"}],"instructors":[{"name":"Roppo,J","full_name":"James Roppo","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Digital Music Business","sections_evaluated":1,"terms":"2026S","latest_term":"2026S","enrolled":49,"respondents":36,"response_rate":0.735,"scores":{"Goals clear":4.9,"Assignments effective":4.9,"Diverse perspectives":4.9,"Hours/week outside class":0.1,"Instructor clear on expectations":5.0,"Instructor explains concepts":5.0,"Feedback helpful":4.8,"Inclusive environment":4.9,"Course overall":5.0,"Intellectually stimulating":5.0,"Instructor overall":5.0}}}],"notes":null}]},{"course_code":"INTA-GB.3145","title":"Investment Banking and Private Equity in Media and Entertainment Finance","units":1.5,"department":"Inter-Area","schedule_department":"Inter-Area","specializations":["Banking","Corporate Finance","Entertainment, Media & Technology","Finance","Quantitative Finance"],"description":"This course focuses on the role of investment banking and private equity in impacting the evolving media and entertainment industry The course will analyze the fundamental tools of investment banking and private equity including company and sector valuation techniques leveraged buyout and merger and acquisition analysis with a specific focus on how these tools are applied to the media and entertainment industry Based upon an understanding of these fundamental tools the course will examine the major sectors of media and entertainment including radio and TV broadcasting outdoor advertising publishing cable distribution and cable networks internet and general entertainment.","prerequisites":["Pre-req: Full-time MBA, COR1-GB 2311. Co-requisite: FINC-GB 2302.","Pre-req: Focused MBA and COR1-GB 2222.","Pre-req: Part-time MBA, (COR1-GB 2311). Co-requisite: (FINC-GB 2302).","Not open to students with 24 or more FINC-GB units."],"sections":[{"section":"30","class_nbr":1860,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"03/24-04/28"}],"instructors":[{"name":"Finkel,S","full_name":"Stephen Finkel","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Investment Banking And Private","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":143,"respondents":98,"response_rate":0.685,"scores":{"Goals clear":4.33,"Assignments effective":4.09,"Diverse perspectives":4.39,"Hours/week outside class":0.26,"Instructor clear on expectations":4.27,"Instructor explains concepts":4.27,"Feedback helpful":3.96,"Inclusive environment":4.36,"Course overall":4.4,"Intellectually stimulating":4.46,"Instructor overall":4.3}}},{"name":"Grovit,P","full_name":"Philip Grovit","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Investment Banking And Private","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":143,"respondents":98,"response_rate":0.685,"scores":{"Goals clear":4.33,"Assignments effective":4.09,"Diverse perspectives":4.39,"Hours/week outside class":0.26,"Instructor clear on expectations":4.27,"Instructor explains concepts":4.28,"Feedback helpful":4.0,"Inclusive environment":4.37,"Course overall":4.4,"Intellectually stimulating":4.46,"Instructor overall":4.27}}},{"name":"Seevers,L","full_name":"Leonard Seevers","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Investment Banking And Private","sections_evaluated":2,"terms":"2025S, 2026S","latest_term":"2026S","enrolled":98,"respondents":66,"response_rate":0.673,"scores":{"Goals clear":4.44,"Assignments effective":4.27,"Diverse perspectives":4.34,"Hours/week outside class":0.24000000000000002,"Instructor clear on expectations":4.6,"Instructor explains concepts":4.68,"Feedback helpful":4.27,"Inclusive environment":4.58,"Course overall":4.6,"Intellectually stimulating":4.54,"Instructor overall":4.64}}}],"notes":null}]},{"course_code":"INTA-GB.3312","title":"Intl Immersion: Luxury & Retail","units":3.0,"department":"Inter-Area","schedule_department":"Inter-Area","specializations":["Global Business","Luxury Marketing","Strategy"],"description":"In F&L's International Immersion course we'll cover the luxury goods sector in Europe and will focus on manufacturing. This course covers such topics as supply chain, sustainability, managing SMEs, profitability, marketing, business models and the challenges and opportunities facing luxury companies today. The course will culminate in a deep dive live case that will examine a particular company, production method, or supply chain and how this relates to the prevalent business models in the European luxury sector. The case will provide students with the opportunity to begin applying their knowledge and skills to a real market challenge, interact with industry stakeholders, and provide them with recommendations.","prerequisites":["Prerequisite: INTA-GB Departmental Max and Non-Stern"],"sections":[{"section":"F1","class_nbr":1861,"instruction_mode":"In-Person","alternate_schedule":true,"meetings":[{"days_time":"MTWRFSaSu 9:00 am - 9:00 pm","dates":"01/09-01/17"}],"instructors":[{"name":"Serdari,T","full_name":"Thomai Serdari","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Intl Immersion:Luxury & Retail","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":67,"respondents":38,"response_rate":0.567,"scores":{"Goals clear":4.0,"Assignments effective":3.84,"Diverse perspectives":4.31,"Hours/week outside class":0.8,"Instructor clear on expectations":3.9,"Instructor explains concepts":4.12,"Feedback helpful":4.03,"Inclusive environment":4.31,"Course overall":4.43,"Intellectually stimulating":4.39,"Instructor overall":4.27}}}],"notes":"Focused Mandatory pre-departure meeting: Wednesday, Dec 1, 2026 4:30-5:30PM Travel Dates: Jan 9 - 17, 2027"}]},{"course_code":"INTA-GB.3314","title":"Luxury & Retail Solutions","units":3.0,"department":"Inter-Area","schedule_department":"Inter-Area","specializations":["Luxury Marketing","Management of Technology & Operations"],"description":"In this experiential MBA course, we will explore the conditions that influence consumer desirability for the client brand. Our goal is to analyze the market conditions, both macro and micro, that influence the consumer participation of the client brand. Typically, this entails an overhaul of the consumer journey and focusing on specific pain points that detract from the client's effort to attract attention, increase desirability, sales and profitability. There is a different client each spring semester and, as a result, a unique business challenge to solve. Our role is to take the client's inquiry and help them come to a viable solution.","prerequisites":["Not open to students with more than 24 INTA-GB units or have taken INTA-GB 3345."],"sections":[{"section":"F1","class_nbr":1862,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"02/03-04/28"}],"instructors":[{"name":"Narayanan,S","full_name":null,"full_name_source":null,"name_source":"schedule","evaluation_2023_2026":null}],"notes":"Focused - Luxury & Retail To Drop course, email experiential@stern.nyu.edu."}]},{"course_code":"INTA-GB.3322","title":"Tech Immersion","units":3.0,"department":"Inter-Area","schedule_department":"Inter-Area","specializations":["Strategy"],"description":"Tech Immersion","prerequisites":["Prerequisite: INTA-GB Departmental Max and Non-Stern"],"sections":[{"section":"F2","class_nbr":2002,"instruction_mode":"In-Person","alternate_schedule":true,"meetings":[{"days_time":"MTWRFSaSu 9:00 am - 9:00 pm","dates":"01/04-01/10"},{"days_time":"MTWRFSaSu 9:00 am - 9:00 pm","dates":"01/10-01/13"}],"instructors":[{"name":"Schilling,M","full_name":"Melissa A Schilling","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Tech Immersion","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":101,"respondents":61,"response_rate":0.604,"scores":{"Goals clear":4.11,"Assignments effective":3.54,"Diverse perspectives":4.14,"Hours/week outside class":1.67,"Instructor clear on expectations":4.29,"Instructor explains concepts":4.34,"Feedback helpful":4.02,"Inclusive environment":4.5,"Course overall":4.06,"Intellectually stimulating":4.16,"Instructor overall":4.42}}}],"notes":"Focused Mandatory pre-departure meetings: Mandatory pre-departure meeting: Wednesday, Dec 9, 2026 4:30-6:30PM Travel Dates: Jan 4 - 13, 2027"}]},{"course_code":"MCOM-GB.2106","title":"Improvisation for Effective Leadership","units":1.5,"department":"Management Communication","schedule_department":"Management Communication","specializations":["Leadership and Change Management","Management"],"description":"In this course, you will use improvisation techniques to enhance your ability to think on your feet, connect with others, build trusting relationships, and develop greater confidence to make good things happen. Through improvisation, you will learn how to listen openly, let judgments of yourself and others fall away, and adapt to change. After all, effective leadership communication is that which compels change in what we do as individuals, as a team, and as a company. It is about developing a strategy and communicating it so compellingly that it brings new ideas to life. Improvisation is unique in its ability to heighten awareness of self and others, helping you take and support responsible risks, owning your authority and sharing it well when it makes sense. Staying empathic, agile, and present amidst ambiguity and adversity is essential to cultivating the resilience and integrity needed to become a leader in an increasingly transparent society. That is what this course is designed to help you do!","prerequisites":["MCOM-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":2025,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 10:30 am - 11:50 am","dates":"01/25-03/10"}],"instructors":[],"notes":null},{"section":"30","class_nbr":2017,"instruction_mode":"Online","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"03/25-04/29"}],"instructors":[],"notes":"Online"}]},{"course_code":"MCOM-GB.2107","title":"Storytelling for Impact","units":1.5,"department":"Management Communication","schedule_department":"Management Communication","specializations":["Leadership and Change Management"],"description":"A story can influence, persuade, and inspire action. This course is designed for students who want to explore the power of stories in a business context and improve their storytelling abilities. In each class session, students will have the opportunity to practice delivering a story that is based on their own experience, and then receive feedback on the story's impact from their peers and the professor. Students will learn how to find, develop, and tell compelling stories that elicits an emotion/response/reaction from their audience. Practice exercises will focus on expanding their range of expressiveness and enhancing their ability to communicate congruently. Throughout the course, students will engage in a process of personal reflection on their stories and storytelling techniques, view videos, and read articles. They also will develop a library of personal stories that can engage audiences and make their messages memorable.","prerequisites":["MCOM-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":2033,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 1:30 pm - 4:20 pm","dates":"03/30-05/04"}],"instructors":[{"name":"Lennard,D","full_name":"Diane Lennard","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Storytelling For Impact","sections_evaluated":2,"terms":"2025S, 2026S","latest_term":"2026S","enrolled":50,"respondents":25,"response_rate":0.5,"scores":{"Goals clear":4.77,"Assignments effective":4.77,"Diverse perspectives":4.84,"Hours/week outside class":0.48000000000000004,"Instructor clear on expectations":4.83,"Instructor explains concepts":4.74,"Feedback helpful":4.9,"Inclusive environment":4.84,"Course overall":4.83,"Intellectually stimulating":4.74,"Instructor overall":4.83}}}],"notes":null}]},{"course_code":"MCOM-GB.2129","title":"Engage Your Audience","units":1.5,"department":"Management Communication","schedule_department":"Management Communication","specializations":["Leadership and Change Management","Management"],"description":"Engage Your Audience: In-Person and Online COURSE OVERVIEW Successful business presentations whether in-person or online are based on effective communication strategy. This course is designed for students who want to become more dynamic and engaging presenters in-person and on virtual meeting platforms. Three sessions will be held on-site at Stern and three sessions will be held virtually. Practice exercises will focus on planning effective strategy; refining visual vocal and verbal delivery to strengthen your in-person and online presence; structuring and designing content; and handling questions from both internal and external audiences. During this course you will prepare and deliver in-person and recorded online individual presentations as well as in-person and live online team presentations. Students will benefit from individual feedback and coaching.","prerequisites":["MCOM-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":2021,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 1:30 pm - 4:20 pm","dates":"01/26-03/23"}],"instructors":[{"name":"Lennard,D","full_name":"Diane Lennard","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Engage Your Audience","sections_evaluated":8,"terms":"2024S, 2024U, 2025S, 2025U, 2025F, 2026S, 2026U","latest_term":"2026U","enrolled":189,"respondents":142,"response_rate":0.751,"scores":{"Goals clear":4.92,"Assignments effective":4.84,"Diverse perspectives":4.7,"Hours/week outside class":1.17,"Instructor clear on expectations":4.89,"Instructor explains concepts":4.86,"Feedback helpful":4.85,"Inclusive environment":4.82,"Course overall":4.87,"Intellectually stimulating":4.78,"Instructor overall":4.88}}}],"notes":null}]},{"course_code":"MCOM-GB.3112","title":"Difficult Conversations","units":1.5,"department":"Management Communication","schedule_department":"Management Communication","specializations":["Management"],"description":"Successful business relationships require the ability to manage difficult conversations. When managing clients, managing direct reports, or managing up, you will encounter difficult conversations. This course will enable you to effectively lead your most challenging and consequential conversations at work to desired outcomes. You will gain an understanding of the variety of difficult conversations, the neuroscience of what makes a conversation difficult, and the business case for why avoiding these conversations is too costly for employees' careers and for their organizations' effectiveness. Through readings, group practice with feedback, analysis of past challenging conversations, and class discussions, you will learn how to use the core communication skills to manage difficult conversations well, and how to identify and manage interests and motivations. You will practice difficult conversations, reflect on these interactions, and action plan for future conversations. As a result of this course, you will be able to identify the personalized mindset and behavior shifts you need to master \"crucial conversations\" and perform effectively during the most critical moments in your career.","prerequisites":["Prerequisite: Focused MBA and COR1-GB 2105.","Prerequisite: Part-time MBA and MCOM-GB 2105.","Not open to students with more than 24 MCOM-GB units."],"sections":[{"section":"20","class_nbr":2023,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 1:30 pm - 4:20 pm","dates":"01/25-03/22"}],"instructors":[{"name":"Wynn,J","full_name":"Jennifer Wynn","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Difficult Conversations","sections_evaluated":9,"terms":"2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":262,"respondents":187,"response_rate":0.714,"scores":{"Goals clear":4.91,"Assignments effective":4.77,"Diverse perspectives":4.92,"Hours/week outside class":0.5900000000000001,"Instructor clear on expectations":4.97,"Instructor explains concepts":4.91,"Feedback helpful":4.8,"Inclusive environment":4.96,"Course overall":4.84,"Intellectually stimulating":4.77,"Instructor overall":4.94}}}],"notes":null}]},{"course_code":"MCOM-GB.3113","title":"Reparative Conversations","units":1.5,"department":"Management Communication","schedule_department":"Management Communication","specializations":["Leadership and Change Management","Management"],"description":"Developing and repairing trust are critical parts of all successful business relationships with clients, direct reports, bosses, and others. Research shows that teams with a high level of trust perform better, recover from setbacks more readily, and even have superior health outcomes. This course will enable you to build trust, facilitate repair when distrust has weakened a relationship, and begin to cultivate environments of trust at work and beyond. Through readings, videos, in-class discussions, analysis of past relationships, and the planning and practice of real-life reparative conversations, you will learn to: 1) Identify the elements of a relationship that build or harm trust, and the associated behaviors used to build strong teams; 2) Apply the knowledge, skills, mindsets, and frameworks to lead reparative conversations with individuals and groups; and 3) Increase your ability to assess trust levels and make informed decisions about the best way to move forward. Regardless of your starting point, Reparative Conversations will empower you to better manage the cycle of building, maintaining, and repairing trust, as well as creating more resilient relationships.","prerequisites":["MCOM-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":2032,"instruction_mode":"Online","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"02/03-03/10"}],"instructors":[{"name":"Wynn,J","full_name":"Jennifer Wynn","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Reparative Conversations","sections_evaluated":6,"terms":"2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":161,"respondents":119,"response_rate":0.739,"scores":{"Goals clear":4.87,"Assignments effective":4.8,"Diverse perspectives":4.97,"Hours/week outside class":0.6000000000000001,"Instructor clear on expectations":4.94,"Instructor explains concepts":4.96,"Feedback helpful":4.83,"Inclusive environment":4.99,"Course overall":4.85,"Intellectually stimulating":4.78,"Instructor overall":4.97}}}],"notes":"Online"},{"section":"31","class_nbr":10091,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 6:00 pm - 9:00 pm","dates":"03/30-05/04"}],"instructors":[{"name":"Wynn,J","full_name":"Jennifer Wynn","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Reparative Conversations","sections_evaluated":6,"terms":"2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":161,"respondents":119,"response_rate":0.739,"scores":{"Goals clear":4.87,"Assignments effective":4.8,"Diverse perspectives":4.97,"Hours/week outside class":0.6000000000000001,"Instructor clear on expectations":4.94,"Instructor explains concepts":4.96,"Feedback helpful":4.83,"Inclusive environment":4.99,"Course overall":4.85,"Intellectually stimulating":4.78,"Instructor overall":4.97}}}],"notes":null}]},{"course_code":"MCOM-GB.3114","title":"Inclusive Conversations","units":1.5,"department":"Management Communication","schedule_department":"Management Communication","specializations":["Leadership and Change Management","Management"],"description":"Research shows that being on inclusive teams makes people more creative, more diligent, and harder-working, and that more diverse leadership teams outperform their less diverse peers in financial returns. Furthermore, inclusion leads to increased innovation, which is critically important in today's rapidly changing world. So what does inclusion mean and how does one cultivate it? This course aims to develop mindful, inclusive communication skills to enable belonging and increase success for all. With this course, you will gain foundational knowledge of inclusive language, build awareness of your social identities and their relationship to inclusion, and practice increasing inclusion and cross-difference understanding. Through readings, videos, conversation role plays, self- reflection, peer feedback, case analyses, and class discussions, by the end of this course, you will be able to: 1) Recognize to what extent an interaction is or is not inclusive; 2) Apply the knowledge, skills, mindsets, and frameworks learned in this course to maximize inclusion in your conversations at work and beyond; and 3) Empower yourself and others to foster inclusive team communication and to continue ongoing learning about inclusion. Inclusive Conversations is for everyone who wants to create more shared understanding and connection across lines of difference, both 1:1 and in teams. Regardless of your starting point, this course will empower you to grow your emotional, relational, and cultural intelligences.","prerequisites":["MCOM-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":2036,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 6:00 pm - 9:00 pm","dates":"03/30-05/04"}],"instructors":[],"notes":null}]},{"course_code":"MGMT-GB.2100","title":"Inclusive Leadership","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Leadership and Change Management","Management","Sustainable Business and Innovation"],"description":"In today's rapidly changing global economy, companies with the best talent are at a competitive advantage and inclusive leadership skills are increasingly at a premium. This course will provide students with the skills and strategies to be inclusive leaders: to recognize their own agency to interrupt implicit bias, develop and support allies of diverse backgrounds, address microaggressions, and to leverage the talent on their teams to achieve business outcomes. Students will be able to utilize the lessons of the course in their own career decisions as well as when managing, being managed by, or collaborating with others. The course is highly interactive so that students can learn from each other as well as guest speakers such as the former CEO of Jamba Juice and author of Anti-Racist Leadership, the head of multi-cultural marketing at Johnson & Johnson, the Chief Impact Officer at Advantage Capital, and the Vice-Chairman of global capital markets at Morgan Stanley. Any student who wants to deliver better results through better people decisions should take this class.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1989,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 6:00 pm - 9:00 pm","dates":"03/29-05/03"}],"instructors":[{"name":"Weisberg,A","full_name":"Anne Weisberg","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Inclusive Leadership","sections_evaluated":5,"terms":"2023F, 2024S, 2024F, 2025S","latest_term":"2025S","enrolled":162,"respondents":105,"response_rate":0.648,"scores":{"Goals clear":4.54,"Assignments effective":4.22,"Diverse perspectives":4.7,"Hours/week outside class":0.6100000000000001,"Instructor clear on expectations":4.58,"Instructor explains concepts":4.52,"Feedback helpful":4.27,"Inclusive environment":4.76,"Course overall":4.39,"Intellectually stimulating":4.3,"Instructor overall":4.51}}},{"name":"Rashid,R","full_name":"Ripa Rashid","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Inclusive Leadership","sections_evaluated":5,"terms":"2023F, 2024S, 2024F, 2025S, 2026S","latest_term":"2026S","enrolled":161,"respondents":104,"response_rate":0.646,"scores":{"Goals clear":4.62,"Assignments effective":4.35,"Diverse perspectives":4.81,"Hours/week outside class":0.55,"Instructor clear on expectations":4.67,"Instructor explains concepts":4.6,"Feedback helpful":4.43,"Inclusive environment":4.83,"Course overall":4.5,"Intellectually stimulating":4.41,"Instructor overall":4.64}}}],"notes":null}]},{"course_code":"MGMT-GB.2107","title":"Becoming You: Crafting Your Authentic Career","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Leadership and Change Management","Management"],"description":"The objective of this class is to guide students through the complex, exhilarating, and sometimes surprising journey of discovering the right career for them, one rich with opportunity, meaning, and impact. \"Becoming You\" grows out of the premise that the happiest, most fulfilling lives are those lived in your \"Area of Destiny,\" the intersection of your best and most unique skills, your deepest and most authentic values, and the economy's most rewarding spaces. On many levels, the Area of Destiny construct is intuitive — of course you should be doing what you're good at, what you love, and what the world needs. But what's less intuitive is how often smart, ambitious, and often enlightened people end up with lives and careers that are less deliberate and joyful, and more accidental and stressful, than they'd ever wanted. With readings from memoirs that are as illuminating as they are brutally honest (Tina Fey, Steve Wozniak, and Phil Knight), spell-binding documentaries about trailblazers such as Dr. Dre and Iris Apfel (to name a few), as well as classical works about identity by great philosophers and social scientists, \"Becoming You\" will explore career journeys that are provocative — and instructive. But the career journey at the center of this class is yours. Where have you been and how has it shaped you? What are you dying to leave behind, and what is ahead that scares you? What is your unedited dream of a life? What are your non-negotiables around lifestyle? Do you have what it takes to be an entrepreneur? And what about money…really? Analytic tools, assessment surveys, and exercises will be employed in each student's personal exploration process, along with team activities, writing assignments, and guest speakers from careers paths both conventional and unorthodox. The course will conclude with a capstone project in which each student will identify their own \"Area of Destiny,\" either newly discovered or confirmed, and the roadmap to it, now and in the future. Non-refundable course fee of approximately $225 charged to student bursar accounts after the drop/add deadline to cover the cost of mandatory assessments.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1982,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"03/24-04/28"}],"instructors":[{"name":"Welch,S","full_name":"Suzanne Welch","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Becoming You: Authentic Career","sections_evaluated":9,"terms":"2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":616,"respondents":413,"response_rate":0.67,"scores":{"Goals clear":4.78,"Assignments effective":4.66,"Diverse perspectives":4.52,"Hours/week outside class":0.6900000000000001,"Instructor clear on expectations":4.76,"Instructor explains concepts":4.72,"Feedback helpful":4.19,"Inclusive environment":4.6,"Course overall":4.73,"Intellectually stimulating":4.66,"Instructor overall":4.71}}}],"notes":null}]},{"course_code":"MGMT-GB.2113","title":"The Strategist","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Leadership and Change Management","Management","Strategy"],"description":"Business success requires being different. To succeed, a business needs to stand out from the competition. This is what business strategy courses teach, and they are right. But finding a way to be different is harder than just knowing that it is important to be different. This is the fundamental challenge facing the business strategist. It is the challenge of looking at an existing organization and coming up with ways to make its position in the marketplace more distinctive. Or, it is the challenge of looking at the potential of a new business and creating a distinct position for it. The strategist is equally important in the worlds of existing enterprise and of entrepreneurship. The challenge of being different is considerable. Much of the time, everyone has access to more or less the same knowledge base. This is likely even more the case today, in a globally interconnected world, relative to the past. In this environment, the key to being different becomes one's ability to think differently. Of course, one has to think both differently and better, and come up with not just a different but a superior business proposition. Out-thinking others in this way is the job of the business strategist. In this course, we will develop a four-way framework to help us think differently and better and become better business strategists. The four components of the framework (4 C's) are: Strategy from Contrast Strategy from Combination Strategy from Constraint Strategy from Context We will examine many examples of great business strategies of each of these four types, and we will also use this framework to help us generate entirely new strategies.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":1936,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 1:30 pm - 4:20 pm","dates":"03/25-04/29"}],"instructors":[{"name":"Brandenburger,A","full_name":"Adam M Brandenburger","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"The Strategist","sections_evaluated":8,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":698,"respondents":420,"response_rate":0.602,"scores":{"Goals clear":4.57,"Assignments effective":4.4,"Diverse perspectives":4.7,"Hours/week outside class":0.49000000000000005,"Instructor clear on expectations":4.67,"Instructor explains concepts":4.61,"Feedback helpful":4.11,"Inclusive environment":4.76,"Course overall":4.45,"Intellectually stimulating":4.34,"Instructor overall":4.59}}}],"notes":null}]},{"course_code":"MGMT-GB.2124","title":"Managing Family Businesses and Privately Held Firms","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Entrepreneurship and Innovation","Management","Strategy"],"description":"This course explores the business personal and family issues found in family owned and operated companies The managerial strategic and behavioral complexities in these environments will be analyzed. The course focuses on these principal themes: 1) How are family businesses distinct from other firms? 2) What is the lifecycle of the family business? 3) What are the unique managerial challenges of family-owned businesses and how can they be successfully resolved?","prerequisites":["Prereq:Full-time MBA &(COR1-GB.1302 or COR1-GB.1102) or Co-req:Full-time MBA & COR1-GB.2104","Prereq: Focused MBA & (COR1-GB 1102 or COR1-GB 2101)","Prereq: Part-time MBA & (COR1-GB 1302 or CORE-GP 1020).","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"30","class_nbr":1971,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 6:00 pm - 9:00 pm","dates":"03/30-05/04"}],"instructors":[{"name":"Villalonga,B","full_name":"Belen Villalonga","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Managing Family Businesses","sections_evaluated":3,"terms":"2023F, 2025S, 2026S","latest_term":"2026S","enrolled":115,"respondents":78,"response_rate":0.678,"scores":{"Goals clear":4.43,"Assignments effective":4.2,"Diverse perspectives":4.68,"Hours/week outside class":0.49000000000000005,"Instructor clear on expectations":4.46,"Instructor explains concepts":4.4,"Feedback helpful":4.19,"Inclusive environment":4.7,"Course overall":4.29,"Intellectually stimulating":4.29,"Instructor overall":4.39}}}],"notes":null}]},{"course_code":"MGMT-GB.2132","title":"The Entrepreneurial Mindset for Business Leaders","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Entrepreneurship and Innovation","Management"],"description":"Today's leaders face a world where information is incomplete, change is constant, and hesitation can cost you. This course gives MBA students a powerful new decision-making toolkit grounded in entrepreneurial thinking — designed not for starting companies, but for leading with agility, clarity, and confidence. Through real-world cases, interactive exercises, and practical tools, you'll learn how to: -Make High-Velocity Decisions — Act quickly and strategically without waiting for perfect data. -Think Like an Entrepreneur — Use available resources, take smart risks, and move forward even when the path isn't clear. -Break Out of Analysis Paralysis — Recognize the habits that slow you down — and learn how to override them. -Lead Through Uncertainty — Build a mindset and culture that embraces iteration, adaptability, and bold action. -Apply Effectual Thinking — Shift from prediction to control, using proven methods to create opportunities from what you already have. This course reframes decision-making as a creative, action-oriented process — giving you the mindset and methods to lead in any environment.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":1991,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 1:30 pm - 2:50 pm","dates":"03/24-05/03"}],"instructors":[{"name":"Bhatia,A","full_name":"Ashish Bhatia","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"The Entrepreneurial Mindset","sections_evaluated":1,"terms":"2026S","latest_term":"2026S","enrolled":53,"respondents":31,"response_rate":0.585,"scores":{"Goals clear":4.3,"Assignments effective":4.0,"Diverse perspectives":4.6,"Hours/week outside class":0.5,"Instructor clear on expectations":4.5,"Instructor explains concepts":4.5,"Feedback helpful":4.4,"Inclusive environment":4.7,"Course overall":4.2,"Intellectually stimulating":4.1,"Instructor overall":4.5}}}],"notes":null}]},{"course_code":"MGMT-GB.2135","title":"Startup Toolkit","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Entrepreneurship and Innovation","Management"],"description":"Are you \"startup curious\"? Are you in the early stages of thinking about an idea or maybe joining a startup after completing your MBA? Are you considering a role in Venture Capital? This course is for students who want to do a cursory exploration of the core elements of getting a startup off the ground. Regardless of the type of business - from software, hardware and services, to consumer goods - to which go to market strategy you choose (B2B, DTC, etc.), this course will offer hands-on skills-building exercises using fictional ideas we'll create together at the start of the course. Upon completion of this course, students will have a useful toolkit to further their exploration of the startup world.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":19430,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 1:30 pm - 4:20 pm","dates":"03/25-04/29"}],"instructors":[{"name":"Austin,J","full_name":"Julia Austin","full_name_source":"web (NYU Stern site)","name_source":"schedule","evaluation_2023_2026":null}],"notes":null}]},{"course_code":"MGMT-GB.2143","title":"Strategy & Innovation in China","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Entrepreneurship and Innovation","Global Business","Management","Strategy"],"description":"The goal of the course is to equip students with a better understanding of the strategy and innovation lessons from China. In particular, we discuss cutting-edge innovation in important industries ranging from social media to telecommunications. Many of the Chinese firms we study are already world class competitors. As such, while our focus is China, you will find that the principles of innovation are generally applicable elsewhere. The course provides a quick survey of China's unique business landscape, in addition to a generalized toolkit to analyze strategy and innovation in fast growing industries. Whether your goal is to do business in China and beyond, or to better compete with Chinese firms in your existing industry here in the US, you will find the course informative, relevant and timely. The course examines many different types of business — private and public, Chinese and American — and the institutions that have and will define China's economic trajectory and its role in the global economy. We will read and discuss a combination of cases, academic articles, book chapters as well as real-time news and reports.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":1986,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 1:30 pm - 4:20 pm","dates":"03/30-05/04"}],"instructors":[{"name":"Fang,C","full_name":"Christina H Fang","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Strategy & Innovation In China","sections_evaluated":6,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":225,"respondents":135,"response_rate":0.6,"scores":{"Goals clear":4.78,"Assignments effective":4.68,"Diverse perspectives":4.83,"Hours/week outside class":0.52,"Instructor clear on expectations":4.83,"Instructor explains concepts":4.77,"Feedback helpful":4.59,"Inclusive environment":4.85,"Course overall":4.75,"Intellectually stimulating":4.74,"Instructor overall":4.82}}}],"notes":"Online"}]},{"course_code":"MGMT-GB.2159","title":"Collaboration, Conflict, and Negotiation","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Leadership and Change Management","Management"],"description":"Successful managers know how to collaborate with other people effectively and how to resolve conflicts constructively. The goal of this course is to teach students the fundamentals of managing collaboration and conflict in one-on-one and small group settings. Our objective is to enhance students' interpersonal skills at their jobs. Drawing from the latest findings in managerial psychology, we cover the fundamentals of effective negotiation, communication, and persuasion. Special topics include getting buy-in, coping with resistance, and building coalitions.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":1939,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 9:00 am - 11:50 am","dates":"03/30-05/04"}],"instructors":[{"name":"Hewlin,J","full_name":"Jay Hewlin","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Collaboration, Conflict, And N","sections_evaluated":6,"terms":"2023F, 2024W, 2024F, 2025F, 2026W","latest_term":"2026W","enrolled":219,"respondents":157,"response_rate":0.717,"scores":{"Goals clear":4.68,"Assignments effective":4.7,"Diverse perspectives":4.86,"Hours/week outside class":1.26,"Instructor clear on expe ions With Executives and Lawyers","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Entrepreneurship and Innovation","Law & Business","Leadership and Change Management","Management"],"description":"In this innovative and practical course students from the Law school and the Business school come together at Stern to learn what it takes to negotiate major transactions Most key corporate deals such as mergers financing international joint ventures and settlements are legal business problems So it crucial for lawyers and business people to know how to work well together and how to design wise agreements To develop these skills students negotiate a variety of simulated transactions and conflicts They take one deal from concept to term sheet to contract and then see its effects months later They grapple with whether to sue or settle They even trade roles at least once They also examine real agreements perhaps meeting and questioning guest speakers who actually negotiated them They also discover ways to design better transactions with the help of economics and other important theoretical tools Through their continuing work together they overcome their natural feelings of professional culture shock and learn how to work as a team to create sound agreements as their future employers expect them to do. A basic course on negotiation such as Collaboration Conflict Negotiation MGMT-GB.2159 or Lawyering LAW-LW 10687 is a prerequisite for the course; there is no prerequisite for LLMs. The course is different from Stern's Advanced Topics in Negotiation which focuses mainly on negotiating in organizations. (While the course will end December 20, no final and assignments are scheduled, which gives law students time to prepare for other final exams.)","prerequisites":["Prerequisites: Full-time MBA & ( (MGMT-GB 2159 or LAW-LW 10687).","Prerequisites: Part-time MBA & (MGMT-GB 2159 or LAW-LW 10687 or PADM-GP 4101).","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"30","class_nbr":1945,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"03/25-04/29"}],"instructors":[{"name":"Freeman,S","full_name":"Seth Freeman","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Negotiating Complex Transactio","sections_evaluated":6,"terms":"2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":217,"respondents":119,"response_rate":0.548,"scores":{"Goals clear":4.69,"Assignments effective":4.53,"Diverse perspectives":4.64,"Hours/week outside class":1.09,"Instructor clear on expectations":4.55,"Instructor explains concepts":4.7,"Feedback helpful":4.31,"Inclusive environment":4.64,"Course overall":4.62,"Intellectually stimulating":4.66,"Instructor overall":4.64}}}],"notes":null}]},{"course_code":"MGMT-GB.2164","title":"Advanced Topics in Negotiation: Corporate Deals, Decisions, and Diplomacy","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Law & Business","Leadership and Change Management","Management"],"description":"How do you negotiate with many parties? With Godzilla? With other organizations? High stakes? Multiple issues? How do you build a consensus everyone's committed to? How do you act as an agent with constituents and mandates? Deal with talks in the public eye? In short, how do you negotiate corporate life, where things are more challenging than simple one-on-one transactions? In this hands-on, practical continuation of Collaboration, Conflict & Negotiation (CCN), students do a series of increasingly difficult negotiation simulations that help them gain new tools and principles for dealing with the harder talks that happen in corporate life. Students learn to handle multi-party talks, ready for talks with a host of issues using a 'playcard' that gives them 'glance and go' guidance, and deal with highly intimidating counterparts, in part by learning to 'war game.' They also learn to resolve conflicts well even when they have too much responsibility and not enough authority, handle the complex diplomatic challenges of talks between groups and firms, and more. In a capstone simulation, students handle a complex, high-stakes, high-stress, deal on video and then, like athletes, review the tape to discover hidden weaknesses and strengths. CCN is the only pre-requisite. The course complements other Advanced Topics in Negotiation courses and Negotiating Complex Transactions with Executives & Lawyers, which can be taken concurrently or in any order.","prerequisites":["Prerequisites: Full-time MBA and MGMT-GB 2159.","Prerequisites: Part-time MBA and (MGMT-GB 2159 or PADM-GP 4101).","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"30","class_nbr":1966,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 6:00 pm - 9:00 pm","dates":"02/02-03/23"}],"instructors":[{"name":"Freeman,S","full_name":"Seth Freeman","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Adv Neg:Corp Deals, Deci&Diplo","sections_evaluated":10,"terms":"2023U, 2023F, 2024S, 2024U, 2024F, 2025S, 2025U, 2025F, 2026S, 2026U","latest_term":"2026U","enrolled":354,"respondents":250,"response_rate":0.706,"scores":{"Goals clear":4.66,"Assignments effective":4.48,"Diverse perspectives":4.57,"Hours/week outside class":0.8900000000000001,"Instructor clear on expectations":4.62,"Instructor explains concepts":4.63,"Feedback helpful":4.38,"Inclusive environment":4.63,"Course overall":4.5,"Intellectually stimulating":4.55,"Instructor overall":4.58}}}],"notes":null}]},{"course_code":"MGMT-GB.2308","title":"Venture Building for Entrepreneurs and Intrapreneurs","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Entrepreneurship and Innovation","Management","Strategy","Tech Product Management"],"description":"The future is fast, complex and in flux. Markets are being reshaped at an unprecedented pace, creating a world where disruption is common-place and innovation is not only expected but increasingly necessary. Every player is entering the race to win with the next big bet - entrepreneurs working at start-ups and venture studios, and intrapreneurs, working within corporations, all vying for a piece of the rapidly changing market. Building new ventures, as an entrepreneur or intrapreneur, has become a coveted skill. This course focuses on teaching that skill, de-mystifying the process and the complexity of creating new ventures and delving into the core steps, techniques and tools that transcend industry and objective. The goal of the course is to prepare students with navigating the uncertainty inherent in building new products, services and lines of business, regardless of their path as venture builders. Students will immerse in the venture building process through the hands-on creation of their own idea, learning how to identify and size a market opportunity, segment customers and define a unique value proposition and business model. Individually or in groups, students will select a project path: venture building for themselves (entrepreneurs) or from within an existing company (intrapreneurs). They will learn, from in-class lecture and detailed case studies, how to move from initial hypothesis to proof of concept, and then apply those learnings to their own idea. Students will be asked to share and evolve their work, in response to feedback and external forces, as occurs in the real world. As the course progresses, so will their ideas, following the arc of venture building and allowing students to absorb the core tools necessary to determine and stress-test their path forward as entrepreneurs and intrapreneurs.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1950,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"02/03-04/28"}],"instructors":[{"name":"Schwartz,G","full_name":"Geoffrey Schwartz","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Venture Bldg For Entrepreneurs","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":89,"respondents":64,"response_rate":0.719,"scores":{"Goals clear":4.9,"Assignments effective":4.67,"Diverse perspectives":4.7,"Hours/week outside class":0.77,"Instructor clear on expectations":5.0,"Instructor explains concepts":4.87,"Feedback helpful":4.73,"Inclusive environment":4.83,"Course overall":4.87,"Intellectually stimulating":4.87,"Instructor overall":4.93}}}],"notes":null}]},{"course_code":"MGMT-GB.2312","title":"Biotechnology Industry, Structure and Strategy","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Healthcare","Management"],"description":"Biotechnology started as a science referring to the use of living cells as factories to produce protein through manipulation of genes Yet today biotechnology refers to an industry with the top companies in the sector exceeding some of the major pharmaceutical companies in market capitalization No longer are biotechnology companies constrained to using recombinant DNA technology alone as the moniker is assigned today to any small company engaged in any life sciencesrelated research directed toward developing a commercial product using any scientific means Belonging to the sector usually also implies a culture 8211 small nimble visionary but practical cash constrained but willing to risk it all While some of the above characteristics are more idealized than real it is certainly the case that while the key factors for success in a development stage company include the very same scientific analytic andor managerial talents that reside in 8220big pharma8221 the context is different requiring the organization to incorporate some additional skills to ensure survival and nontraditional systems to support success The foundation of this course will be the core curriculum that you have all mastered during your first year at Stern You will be at an advantage in that regard relative to some of your future colleagues who work in the industry today The long product development cycles inherent to the industry may minimize the rigor behind decisionmaking since there is a long time lag between the action taken and its ultimate impact Moreover paradoxically there is a 8220comfort8221 to operating at a significant loss for many years spending hundreds of millions of dollars of investors8217 money relieving the incentive to generate incremental revenue or savings that seem insignificant relative to the scale of the investment and the size of the opportunity Finally the need to constantly raise money sometimes favors promotion over analysis and shortterm impact on share price rather than longterm creation of value","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1949,"instruction_mode":"Online","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"02/04-04/29"}],"instructors":[{"name":"Kranzler,J","full_name":"Jay D. Kranzler","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Biotechnology Industry, Struct","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":103,"respondents":77,"response_rate":0.748,"scores":{"Goals clear":4.58,"Assignments effective":4.34,"Diverse perspectives":4.58,"Hours/week outside class":0.9500000000000001,"Instructor clear on expectations":4.52,"Instructor explains concepts":4.59,"Feedback helpful":4.43,"Inclusive environment":4.59,"Course overall":4.49,"Intellectually stimulating":4.56,"Instructor overall":4.73}}}],"notes":"Online"}]},{"course_code":"MGMT-GB.2325","title":"Your Startup Journey: Ready or Not?","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Entrepreneurship and Innovation","Management"],"description":"Most entrepreneurship courses start with the assumption that you have an idea worth pursuing. This one starts earlier — with you. Before building anything, students will grapple with the questions that actually determine whether a venture succeeds or fails: Is this a real problem? Do the right customers care enough to change their behavior? And perhaps most importantly: Do I actually want to do this? Working in teams around ideas they bring to class, students spend the semester in the early trenches of startup creation. You will talk to prospective customers, mapping their worlds, stress-testing assumptions, and iterating toward something worth building. The work is hands-on and often uncomfortable in the best way, designed to simulate the emotional and intellectual reality of the startup rollercoaster, not just the mechanics of it. Some students will emerge more convinced than ever. Others will make the equally valuable decision to get off the ride before it costs them more than a semester. The course culminates in a venture definition artifact that is a concrete, customer-validated articulation of what to build and why. (For students who also take Foundations of Entrepreneurship, this becomes the operational complement to the business plan: one grounded in customer validation and product definition, the other in business model and financial planning.)","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":19394,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 1:30 pm - 4:20 pm","dates":"01/26-05/04"}],"instructors":[{"name":"Austin,J","full_name":"Julia Austin","full_name_source":"web (NYU Stern site)","name_source":"schedule","evaluation_2023_2026":null}],"notes":null}]},{"course_code":"MGMT-GB.2340","title":"Global Strategy","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Global Business","Management","Strategy","Supply Chain Management & Global Sourcing"],"description":"This course provides an understanding of the cultural, political, competitive, technological, legal, and ethical environment in which multinational firms operate. It surveys a range of tools and techniques of environmental analysis for use in assessing foreign and global conditions, opportunities, and threats. It also focuses on multinational corporate strategy organization and management. Students examine the building of strategic capabilities, collaborating across boundaries, developing coordination and control, managing activities and tasks as well as challenges of worldwide functional management geographic subsidiary management and toplevel headquarters management.","prerequisites":["Co-requisite: Full-time MBA and COR1-GB.2103 and COR1-GB.2104.","Prerequisite: Focused MBA and COR1-GB 2101.","Prerequisite: Part-time MBA and COR1-GB 2103 and COR1-GB 2104.","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"20","class_nbr":1954,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 1:30 pm - 4:20 pm","dates":"01/26-05/04"}],"instructors":[{"name":"Dorobantu,S","full_name":"Sinziana Dorobantu","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Global Strategy","sections_evaluated":2,"terms":"2026S","latest_term":"2026S","enrolled":102,"respondents":71,"response_rate":0.696,"scores":{"Goals clear":4.76,"Assignments effective":4.67,"Diverse perspectives":4.8,"Hours/week outside class":0.52,"Instructor clear on expectations":4.86,"Instructor explains concepts":4.86,"Feedback helpful":4.5,"Inclusive environment":4.9,"Course overall":4.82,"Intellectually stimulating":4.76,"Instructor overall":4.9}}}],"notes":null}]},{"course_code":"MGMT-GB.2353","title":"Managing Change","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Healthcare","Leadership and Change Management","Management","Strategy"],"description":"Contemporary business environments contain challenges that demand an increasing pace, volume, and complexity of organizational changes. Most organizations, whether they are entrepreneurial start-ups or long-established Fortune 500 firms, find that they must change or wither. This course is geared toward deepening students' understanding of the challenges, techniques, and burdens associated with initiating and implementing major change in an organization. The objective is to prepare managers, or their consultants and advisers, to meet the challenges of organizational change successfully. As such, the course is especially useful for students who plan careers in management consulting, general management (whether in line or staff positions), and entrepreneurship or corporate venturing.","prerequisites":["Prereq:Full-time MBA &(COR1-GB.1302 or COR1-GB.1102) or Co-req:Full-time MBA & COR1-GB.2104","Prereq: Focused MBA & (COR1-GB 1102 or COR1-GB 2101)","Prereq: Part-time MBA & (COR1-GB 1302 or CORE-GP 1020).","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"30","class_nbr":1952,"instruction_mode":"Online","alternate_schedule":false,"meetings":[{"days_time":"T 7:00 pm - 9:00 pm","dates":"02/02-05/04"}],"instructors":[{"name":"Lechner,A","full_name":"Anat Lechner","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Managing Change","sections_evaluated":12,"terms":"2023U, 2023F, 2024S, 2024U, 2024F, 2025S, 2025U, 2025F, 2026S, 2026U","latest_term":"2026U","enrolled":510,"respondents":365,"response_rate":0.716,"scores":{"Goals clear":4.3,"Assignments effective":4.19,"Diverse perspectives":4.34,"Hours/week outside class":0.8600000000000001,"Instructor clear on expectations":4.32,"Instructor explains concepts":4.36,"Feedback helpful":4.4,"Inclusive environment":4.54,"Course overall":4.17,"Intellectually stimulating":4.22,"Instructor overall":4.33}}}],"notes":"Online; This class will have additional asynchronous work each week."}]},{"course_code":"MGMT-GB.2370","title":"Strategic Design","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Leadership and Change Management","Management","Strategy"],"description":"This course develops student skills at diagnosing organizations and developing prescriptions to improve their effectiveness. It is appropriate for those interested in organizational performance from a managerial or external perspective, e.g. management consultants, investment bankers, and financial analysts. It examines organizations' attempts to adapt as open systems in a competitive environment. We consider the major factors influencing organization design, e.g. strategy, environment, and technology. Then we analyze the major internal processes affecting organizational performance, e.g. control systems, politics, and conflict. Next, we probe how organizations can improve their ability to adapt in increasingly dynamic environments. The course includes domestic and international examples. The main learning methods are case analyses and a study of the organizations of the central competitors in an industry or industries that the class chooses. Particular emphasis is placed on organizational-level problems facing senior management.","prerequisites":["Co-req: Full-time MBA & (COR1-GB.2103 & 2104).","Prereq: Focused MBA & COR1-GB 2101.","Prereq: Part-time MBA & COR1-GB 2103 & COR1-GB 2104 and (COR1-GB 1302 or CORE-GP 1020).","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"30","class_nbr":2778,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"02/03-04/28"}],"instructors":[{"name":"Cattani,G","full_name":"Gino Cattani","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Strategic Design","sections_evaluated":5,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":139,"respondents":103,"response_rate":0.741,"scores":{"Goals clear":4.43,"Assignments effective":4.48,"Diverse perspectives":4.42,"Hours/week outside class":1.02,"Instructor clear on expectations":4.48,"Instructor explains concepts":4.43,"Feedback helpful":4.16,"Inclusive environment":4.4,"Course overall":4.38,"Intellectually stimulating":4.48,"Instructor overall":4.38}}}],"notes":null}]},{"course_code":"MGMT-GB.2395","title":"Strategic Management of AI","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Artificial Intelligence","Management","Strategy"],"description":"This course will take the manager's perspective. Familiarity with any new technology is an important goal for managers, so that competitive and corporate strategies can be aligned to take advantage of potential new opportunities and guard against potential risks from the technology. But new technologies don't appear in a vacuum. They are commercialized against a backdrop of macro-economic trends and cultural norms, and their adoption may depend on these factors as well as industry-specific and firm-specific factors. For example, a firm's relationship with its employees may have direct consequences for the decision to adopt a new technology, or the manner in which a new technology is adopted. This course will provide students with a set of strategy and management frameworks that firms use when assessing how to implement AI in their own organizations, how to use AI as a competitive tool in the marketplace, and how to interact with government regulators and other stakeholders. To accomplish these goals, we will use a variety of popular press readings, academic research papers, cases, and in-class presentations from student groups as well as outside visitors.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":20761,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"TR 9:00 am - 10:20 am","dates":"01/26-05/04"}],"instructors":[{"name":"Seamans,R","full_name":"Robert C. Seamans","full_name_source":"evaluations (other course)","name_source":"schedule","evaluation_2023_2026":null}],"notes":null}]},{"course_code":"MGMT-GB.3129","title":"Advanced Corporate Strategy","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Management","Strategy"],"description":"This course will tackle advanced corporate strategy, and in particular the execution of corporation strategy (e.g., negotiating prices in acquisitions, integration, etc.). This course will pick up where Strategy 2 leaves off and prepare students for the complex task of actually implementing corporate strategy moves such as mergers, acquisitions, spinoffs, etc.","prerequisites":["Co-requisite: Full-time MBA and COR1-GB.2103 and COR1-GB.2104.","Prerequisite: Focused MBA and COR1-GB 2101.","Prerequisite: Part-time MBA and COR1-GB 2103 and COR1-GB 2104.","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"20","class_n urce":"schedule","evaluation_2023_2026":{"eval_course_title":"Building Venture-Scale Startup","sections_evaluated":1,"terms":"2026S","latest_term":"2026S","enrolled":40,"respondents":25,"response_rate":0.625,"scores":{"Goals clear":4.3,"Assignments effective":4.0,"Diverse perspectives":4.6,"Hours/week outside class":0.2,"Instructor clear on expectations":4.4,"Instructor explains concepts":4.3,"Feedback helpful":4.1,"Inclusive environment":4.6,"Course overall":3.9,"Intellectually stimulating":4.2,"Instructor overall":4.2}}}],"notes":null}]},{"course_code":"MGMT-GB.3151","title":"Managerial Decision Making","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Leadership and Change Management","Management","Management of Technology & Operations"],"description":"This course attempts to help you become a better decision maker When asked about their ability to make decisions previous students expresses concerns and several said they lacked self confidence in making decisions Others indicated that the process of making decisions may be painful especially if one has to make an important decision This may stem from the deliberation process one goes through that may be stressful Yet others added that at times they second guess their decisions and some acknowledged that they suffer from regret when a decision they have made led to an undesired outcome A few mentioned that having gone through such a process made them indecisive and unclear about how to go about making decisions The above concerns are described with regard to personal as well as business decisions Making decisions at work may be easier when one can solicit the help from colleagues but at the same time the consequences may loom even larger when making decisions at work This course takes a systematic approach to improve your decision making skills Requirements include several exercises knowledge of statistics is required but the course is not about quantitative calculation of alternatives but about the processes underlying the making of decisions.","prerequisites":["Prereq:Full-time MBA &(COR1-GB.1302 or COR1-GB.1102) or Co-req:Full-time MBA & COR1-GB.2104","Prereq: Focused MBA & (COR1-GB 1102 or COR1-GB 2101)","Prereq: Part-time MBA & (COR1-GB 1302 or CORE-GP 1020).","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"S1","class_nbr":1972,"instruction_mode":"In-Person","alternate_schedule":true,"meetings":[{"days_time":"Su 9:00 am - 4:00 pm","dates":"04/11-04/18"},{"days_time":"Su 9:00 am - 4:00 pm","dates":"05/02-05/02"}],"instructors":[{"name":"Shapira,Z","full_name":"Zur B. Shapira","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Managerial Decision Making","sections_evaluated":5,"terms":"2023F, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":188,"respondents":133,"response_rate":0.707,"scores":{"Goals clear":4.02,"Assignments effective":3.98,"Diverse perspectives":4.19,"Hours/week outside class":0.8600000000000001,"Instructor clear on expectations":4.15,"Instructor explains concepts":4.05,"Feedback helpful":4.0,"Inclusive environment":4.46,"Course overall":3.97,"Intellectually stimulating":3.99,"Instructor overall":4.15}}}],"notes":"Sundays"}]},{"course_code":"MGMT-GB.3165","title":"Power and Professional Influence","units":1.5,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Leadership and Change Management","Management"],"description":"This course is designed for individuals interested in learning more about the art and science of influence in organizations Many people are ambivalent if not disdainful of those who seek to wield power and influence at work but power and influence are key mechanisms by which things get done For those considering careers in management it is important to be able to diagnose situations as opportunities to exercise power and influence in order to form and implement new strategies In addition managers are usually on the receiving end of these processes An astute manager knows how to anticipate moves that others will make how to block or avoid them when they have undesirable consequences and how to help these moves succeed when their consequences are beneficial The course aims to provide you with 8220political intelligence8221 in a sense After taking this course you will be able to 1 diagnose the true distribution of power in organizations 2 identify strategies for building sources of power 3 develop techniques for influencing others and 4 understand the role of power in building cooperation and leading change in organizations These skills will be invaluable throughout your career","prerequisites":["Prerequisites: Full-time MBA & COR1-GB 1302 or COR1-GB.1102.","Prerequisites: Focused MBA & COR1-GB 1102.","Prerequisites: Part-time MBA & COR1-GB 1302 or CORE-GP 1020.","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"20","class_nbr":1973,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 1:30 pm - 4:20 pm","dates":"03/24-04/28"}],"instructors":[{"name":"Kern,M","full_name":"Mary Kern","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Power And Professional Influen","sections_evaluated":3,"terms":"2025F, 2026S","latest_term":"2026S","enrolled":132,"respondents":75,"response_rate":0.568,"scores":{"Goals clear":4.72,"Assignments effective":4.49,"Diverse perspectives":4.83,"Hours/week outside class":0.41000000000000003,"Instructor clear on expectations":4.79,"Instructor explains concepts":4.81,"Feedback helpful":4.61,"Inclusive environment":4.84,"Course overall":4.77,"Intellectually stimulating":4.58,"Instructor overall":4.77}}}],"notes":null}]},{"course_code":"MGMT-GB.3306","title":"Consulting Practice","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Management","Strategy"],"description":"The Stern Consulting Corps (SCC): Consulting Practice- Process and Problem Solving is a hands-on experiential learning opportunity that allows students to work in teams to tackle a business issue or opportunity for a client while applying in real time the key steps of the consulting process they are learning in the classroom. Students will discuss their challenges, approaches and recommendations in class and on-line while benefiting from the guidance and expertise of the instructor and a seasoned strategy consulting professional. Whether students are going into the consulting field or another area of business, this course will show you how to break a complicated problem into pieces that can be individually and methodically addressed. We will discuss how to gather the right data to build a relevant fact base which can be used to drive key conclusions. By working on a live SCC project concurrently, you will benefit from the 'flipped classroom model' to seamlessly integrate knowledge with practice and leave the experience confident in problem solving abilities.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1962,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 6:00 pm - 9:00 pm","dates":"02/01-05/03"}],"instructors":[{"name":"Baptist,B","full_name":"Brett Baptist","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Consulting Practice","sections_evaluated":3,"terms":"2024S, 2025S","latest_term":"2025S","enrolled":83,"respondents":56,"response_rate":0.675,"scores":{"Goals clear":4.4,"Assignments effective":4.18,"Diverse perspectives":4.44,"Hours/week outside class":2.23,"Instructor clear on expectations"
