s, delivering results, and driving success. Management with Purpose is designed for new and aspiring managers who want to lead with intention, building high-performing teams and strong cultures. This course covers the essential managerial skills from hiring to making tough decisions, navigating crises, and managing upward. It also focuses on managerial career growth, offering strategies for promotion and long-term impact. Ultimately, Management with Purpose is about becoming a manager who changes organizations —  and lives – for the better.","prerequisites":["Co-requisites: Full-time MBA & COR1-GB 1302 or COR1-GB.1102.","Co-requisites: Focused MBA & COR1-GB 1102.","Co-requisites: Part-time MBA & COR1-GB 1302 or CORE-GP 1020.","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"30","class_nbr":1981,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"02/04-04/29"}],"instructors":[{"name":"Welch,S","full_name":"Suzanne Welch","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Management With Purpose","sections_evaluated":3,"terms":"2025F, 2026S","latest_term":"2026S","enrolled":159,"respondents":117,"response_rate":0.736,"scores":{"Goals clear":4.72,"Assignments effective":4.42,"Diverse perspectives":4.52,"Hours/week outside class":0.44000000000000006,"Instructor clear on expectations":4.68,"Instructor explains concepts":4.72,"Feedback helpful":4.12,"Inclusive environment":4.55,"Course overall":4.55,"Intellectually stimulating":4.46,"Instructor overall":4.59}}}],"notes":null}]},{"course_code":"MGMT-GB.3323","title":"Game Theory","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Economics","Management","Strategy"],"description":"Game theory studies competitive and cooperative behavior in strategic environments where the fortunes of several players are intertwined It provides methods for identifying optimal strategies and predicting the outcome of strategic interactions The field of game theory began around 1900 when mathematicians began asking whether there were optimal strategies for parlor games such as chess and poker and if so what these strategies might look like The first comprehensive formulation of the subject came in 1944 with the publication of the book Theory of Games and Economic Behavior by famous mathematician John Von Neumann and eminent economist Oskar Morgenstern As its title indicates this book also marked the beginning of the application of game theory to economics Since then game theory has been applied to many other fields including political science military strategy law computer science and biology among other areas In 1994 three pioneers in game theory were awarded a Nobel Prize marking the arrival of the field In 2005 two other prominent researchers in game theory were awarded a Nobel Prize Among the other applications game theory today is finding its way into the world of business Pick up a business magazine or book and there is a good chance that it will use some game theory jargon such as zero sum game Prisoner Dilemma win win game etc As well as learning the underlying theory in the course we be looking at how game theory can indeed be applied to business.","prerequisites":["Co-requisite: Full-time MBA and COR1-GB.2103 and COR1-GB.2104.","Prerequisite: Focused MBA and COR1-GB 2101.","Prerequisite: Part-time MBA and COR1-GB 2103 and COR1-GB 2104.","Not open to students with more than 24 MGMT-GB units."],"sections":[{"section":"20","class_nbr":2006,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"TR 1:30 pm - 2:50 pm","dates":"01/26-05/04"}],"instructors":[{"name":"Seamans,R","full_name":"Robert C. Seamans","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Game Theory","sections_evaluated":5,"terms":"2023F, 2024F, 2025F","latest_term":"2025F","enrolled":161,"respondents":129,"response_rate":0.801,"scores":{"Goals clear":4.58,"Assignments effective":4.41,"Diverse perspectives":4.67,"Hours/week outside class":0.8400000000000001,"Instructor clear on expectations":4.76,"Instructor explains concepts":4.63,"Feedback helpful":4.36,"Inclusive environment":4.74,"Course overall":4.43,"Intellectually stimulating":4.51,"Instructor overall":4.67}}}],"notes":null}]},{"course_code":"MGMT-GB.3335","title":"Foundations of Entrepreneurship","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Entrepreneurship and Innovation","Management","Strategy"],"description":"This course offers a framework for understanding the entrepreneurial process and exposes the student to most problems and issues faced by entrepreneurs who start new ventures. Case study is the principal teaching method supplemented by lectures, a venture planning exercise, and guest speakers. Major objectives are for students to learn how to identify and evaluate market opportunities; develop a venture concept and marketing plan; assess and obtain the required resources; and manage the launch of a new venture.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":1959,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 3:00 pm - 4:20 pm","dates":"01/25-05/03"}],"instructors":[],"notes":null}]},{"course_code":"MGMT-GB.3339","title":"Endless Frontier Labs","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Entrepreneurship and Innovation","Healthcare","Management","Strategy","Tech Product Management"],"description":"Students will learn about the process of successfully taking new ventures to markets, including aspects related to development, management, and financing of ventures. The course will be centered on student observations of the interactions of startup founders & their potential investors. After familiarizing themselves w/ the startups' ideas, students will apply basic analytical tools, drawn from mgmt, econ, and finance to evaluate the size of markets, attractiveness of industries, financing options of early-stage ventures, sustainable competitive advantage of proposed strategies, & the risks and potential of ideas. Along w/ the experiential component, the course will introduce students to a framework for developing an entrepreneurial strategy. Due to the course's special circumstances, which involve working with new companies seeking capital: 1) students sign a non-disclosure agreement, 2) penalty is imposed for missed classes, 3) interested students must apply to the course to be considered. The course will run over the Fall and Spring with students working in teams.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":1963,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 9:00 am - 11:50 am","dates":"01/28-04/29"}],"instructors":[{"name":"Hegde,D","full_name":"Deepak Hegde","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Endless Frontier Labs","sections_evaluated":6,"terms":"2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":516,"respondents":291,"response_rate":0.564,"scores":{"Goals clear":4.38,"Assignments effective":4.06,"Diverse perspectives":4.49,"Hours/week outside class":2.11,"Instructor clear on expectations":4.47,"Instructor explains concepts":4.45,"Feedback helpful":4.07,"Inclusive environment":4.5,"Course overall":4.27,"Intellectually stimulating":4.4,"Instructor overall":4.43}}}],"notes":"Only offered to students enrolled in Fall 2026 Endless Frontier Labs course"}]},{"course_code":"MGMT-GB.3358","title":"Leading Innovation to Address Climate Change","units":3.0,"department":"Management and Organizational Behavior","schedule_department":"Management and Organizational Behavior","specializations":["Global Business","Management","Strategy","Sustainable Business and Innovation"],"description":"The objective of the class is to educate students on how they can lead action to combat climate change and achieve climate adaptation through innovation and accelerating diffusion of innovations. This includes exposing them to a diverse set of technologies that are available for action, helping them to understand the current state of technology diffusion, and providing a playbook on how to: a) assess the technology, b) assess the market potential, and c) create a plan to accelerate technology diffusion In addition, the class will enrich students' understanding of the diverse stakeholders involved, the role of government/public policy (especially as pertains to regulation and business model creation), the opportunity for social impact, and the ethical considerations in technology adoption. The course is interdisciplinary melding concepts from leadership/leading innovation, sustainability, business strategy, technology diffusion, technology assessment, technology development, marketing, public policy, societal impact, and ethics. This class has been developed primarily for practitioners who will lead action that can achieve impact in the next 10-20 years. The primary audience is students who will become: a) product managers, product management leaders, and product development leaders general managers b) startup founders/CEOs, presidents, and other senior leaders c) public policy leaders in climate (government, non-profits, industry organizations, etc.) d) product management/development or general managers for decarbonization efforts within corporations that are not in a sustainability industry. Additional audiences for this class include students who intend to enter careers as investors or consultants related to climate. For example, early-stage tech investors, climate funds, and ESG investors seeking to understand where to place bets on climate-related tech domains and specific companies as well as evaluating the ESG performance of non-climate firms.","prerequisites":["Prerequisite: MGMT-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1965,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 6:00 pm - 9:00 pm","dates":"02/01-05/03"}],"instructors":[{"name":"Carty,R","full_name":"Raphael Carty","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Leading To Address Climate Cha","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":104,"respondents":77,"response_rate":0.74,"scores":{"Goals clear":4.7,"Assignments effective":4.62,"Diverse perspectives":4.77,"Hours/week outside class":0.65,"Instructor clear on expectations":4.76,"Instructor explains concepts":4.65,"Feedback helpful":4.47,"Inclusive environment":4.84,"Course overall":4.55,"Intellectually stimulating":4.73,"Instructor overall":4.72}}}],"notes":null}]},{"course_code":"MKTG-GB.2114","title":"The Business of Sports Marketing","units":1.5,"department":"Marketing","schedule_department":"Marketing","specializations":["Entertainment, Media & Technology","Marketing"],"description":"The business of sports has become a persistent and integral part of our economy, specifically in the multimedia and entertainment arena. This is a specialized course for the MBA student interested in expanding knowledge of the sports industry as a business and as a world economic force. It provides students with a framework for understanding the scope of the sports business across the various leagues, the venues, the athletes and their relationship to internal and external factors, the infrastructure, the professional support system, and the marketing applications that drive this complex and growing multi-billion-dollar industry.","prerequisites":["Prerequisites: Full-time MBA. Co-requisite: COR1-GB 2310.","Prerequisites: Focused MBA. Co-requisite: COR1-GB 2110.","Prerequisites: Part-time MBA and COR1-GB 2310.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"30","class_nbr":1827,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"02/03-03/10"}],"instructors":[{"name":"Land,P","full_name":"Peter A Land","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"The Business Of Sports Marketi","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":162,"respondents":108,"response_rate":0.667,"scores":{"Goals clear":4.25,"Assignments effective":4.12,"Diverse perspectives":4.68,"Hours/week outside class":0.5700000000000001,"Instructor clear on expectations":4.32,"Instructor explains concepts":4.51,"Feedback helpful":4.17,"Inclusive environment":4.63,"Course overall":4.42,"Intellectually stimulating":4.42,"Instructor overall":4.52}}}],"notes":null}]},{"course_code":"MKTG-GB.2116","title":"The Business of Producing: Entrepreneurship in Entertainment & Media","units":1.5,"department":"Marketing","schedule_department":"Marketing","specializations":["Entertainment, Media & Technology","Marketing"],"description":"The course is designed to provide students with a framework for understanding the dynamics of producing a finished creative product in the entertainment and media industries. Covers the process of feature production from the initial concept of the story, through script development, to completion of the project. All the facets of the production process are explored, including script selection, finance, budgeting, timetable development, team building, talent selection, contract and union negotiating, regulation, and technology. Guest speakers include producers on independent movies, network TV, cable, syndicated TV, radio, and TV commercials.","prerequisites":["Prerequisites: Full-time MBA. Co-requisite: COR1-GB 2310.","Prerequisites: Focused MBA. Co-requisite: COR1-GB 2110.","Prerequisites: Part-time MBA and COR1-GB 2310.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"20","class_nbr":1856,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"TR 1:30 pm - 2:50 pm","dates":"03/25-05/04"}],"instructors":[{"name":"Campo,D","full_name":"Darren T Campo","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"The Business Of Producing: Ent","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":95,"respondents":64,"response_rate":0.674,"scores":{"Goals clear":4.42,"Assignments effective":4.45,"Diverse perspectives":4.66,"Hours/week outside class":0.24000000000000002,"Instructor clear on expectations":4.55,"Instructor explains concepts":4.52,"Feedback helpful":4.5,"Inclusive environment":4.69,"Course overall":4.49,"Intellectually stimulating":4.33,"Instructor overall":4.62}}}],"notes":null}]},{"course_code":"MKTG-GB.2119","title":"Entertainment and Media Industries","units":1.5,"department":"Marketing","schedule_department":"Marketing","specializations":["Entertainment, Media & Technology","Marketing","Strategy"],"description":"This course serves as a foundation for those interested in Stern's Entertainment, Media, and Technology (EMT) program. Students who intend to have a specialization in EMT are required to take this course. It provides a framework for understanding the key marketing, economic, and strategic issues facing organizations in the entertainment industry. Covers key sectors of the entertainment industry focusing on film, television, home video, cable, music, publishing, sports, and new media. The course utilizes lectures and case studies.","prerequisites":["Prerequisites: Full-time MBA. Co-requisite: COR1-GB 2310.","Prerequisites: Focused MBA. Co-requisite: COR1-GB 2110.","Prerequisites: Part-time MBA and COR1-GB 2310.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"20","class_nbr":1850,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 3:00 pm - 4:20 pm","dates":"01/25-03/10"}],"instructors":[{"name":"Hardart,P","full_name":"Paul C Hardart","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Entertainment And Media Indust","sections_evaluated":9,"terms":"2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":424,"respondents":288,"response_rate":0.679,"scores":{"Goals clear":4.51,"Assignments effective":4.4,"Diverse perspectives":4.61,"Hours/week outside class":0.6100000000000001,"Instructor clear on expectations":4.59,"Instructor explains concepts":4.63,"Feedback helpful":4.24,"Inclusive environment":4.67,"Course overall":4.5,"Intellectually stimulating":4.46,"Instructor overall":4.67}}}],"notes":null}]},{"course_code":"MKTG-GB.2120","title":"Movie Marketing and Distribution","units":1.5,"department":"Marketing","schedule_department":"Marketing","specializations":["Entertainment, Media & Technology","Marketing"],"description":"The course focuses on marketing, distribution, and exhibition of Hollywood and art house movies. It applies business school marketing methodology to the movie industry and provides a rigorous analysis of why movies succeed or fail regardless of their inherent quality. The class covers strategies used by studio executives to track competitor's strengths and weaknesses in the ever-shifting marketplace and how product tie- ins are increasingly used to raise awareness and sell tickets. Students also learn how film executives think when designing movie posters, planning release schedules, casting top actors, setting up co-branded marketing efforts, green-lighting scripts, capping production budgets, and attending film festivals. Emerging technologies such as video on demand, satellite distribution, and digital projection are also examined. Class sessions are based on lecture and case studies.","prerequisites":["Prerequisite: Full-time MBA. Co-requisite: COR1-GB 2310.","Prerequisite: Focused MBA. Co-requisite: COR1-GB 2110.","Prerequisite: Part-time MBA & (COR1-GB 2310 or GFMTV-GT 2104).","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"30","class_nbr":1830,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 6:00 pm - 9:00 pm","dates":"02/02-03/23"}],"instructors":[{"name":"Faber,G","full_name":"Gary Faber","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Movie Marketing And Distributi","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":115,"respondents":70,"response_rate":0.609,"scores":{"Goals clear":4.57,"Assignments effective":4.55,"Diverse perspectives":4.36,"Hours/week outside class":1.17,"Instructor clear on expectations":4.4,"Instructor explains concepts":4.63,"Feedback helpful":4.42,"Inclusive environment":4.49,"Course overall":4.53,"Intellectually stimulating":4.59,"Instructor overall":4.63}}}],"notes":null}]},{"course_code":"MKTG-GB.2124","title":"Digital Disruption: Creating and Capturing Value","units":1.5,"department":"Marketing","schedule_department":"Marketing","specializations":["Digital Marketing","Entertainment, Media & Technology","Marketing","Strategy","Tech Product Management"],"description":"The digital economy has grown rapidly since the 90s, but until the last few years, its major impact was focused on a few verticals (e.g., media, retail, travel). Now, digital is disrupting most industries led by \"Born of the Web\" companies (e.g., Facebook, Amazon, Netflix, and Google), venture capitalists, and entrepreneurs creating new businesses and disrupting many existing business models. This disruption, whether from Amazon buying Whole Foods, ESPN launching a full direct-to-consumer product, or venture backed companies, is likely to expand quickly as financing and consumer demand are readily available for these businesses to invest in new markets. Three critical frameworks underlie the structure of the proposed course: 1.Value Development and Delivery: Device, Content, Curation and Distribution. This framework explores how to develop and sustain a profitable digital business across the digital value chain. 2.Consumer Journey: Interest, Engagement, Becoming a customer, sustainable monetization. Explores the customer lifecycle and how to maximize total profitability (# of customers and profit per customer) over their full lifecycle vs. just looking at point transactions ROI. 3.Marketing measurement: Online micro measurement, Total Media Mix Measurement, Online/Offline micro attribution. Going beyond current media mix models to understand how to measure and manage marketing's impact on sales and profitability.","prerequisites":["Prerequisites: MBA student and COR1-GB 2310.","Prerequisites: Focused MBA student and COR1-GB 2110.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"30","class_nbr":1831,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 6:00 pm - 9:00 pm","dates":"02/02-03/23"}],"instructors":[{"name":"Keogh,K","full_name":"Kyle Keogh","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Digital Disruption: Creating A","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":153,"respondents":98,"response_rate":0.641,"scores":{"Goals clear":4.35,"Assignments effective":4.09,"Diverse perspectives":4.66,"Hours/week outside class":0.32,"Instructor clear on expectations":4.47,"Instructor explains concepts":4.58,"Feedback helpful":3.9,"Inclusive environment":4.68,"Course overall":4.37,"Intellectually stimulating":4.45,"Instructor overall":4.53}}}],"notes":null}]},{"course_code":"MKTG-GB.2125","title":"Digital Media Innovation","units":1.5,"department":"Marketing","schedule_department":"Marketing","specializations":["Digital Marketing","Entertainment, Media & Technology","Management of Technology & Operations","Marketing","Strategy","Tech Product Management"],"description":"This course is designed to provide you with an orientation to the best current digital marketing practices. We will examine the inner workings of some of the most interesting and fastest growing digital companies and meet some of the leaders of these companies for a first hand view of how digital marketing is evolving and progressing. Course objectives are: 1) To understand the most practiced forms of digital marketing (e.g. social marketing, local marketing, search engine marketing, brand marketing) and how the venture capital world is views these tools and approaches; 2) To learn how advertisers and publishers are working together in the digital world to entice consumers with \"authentic\" marketing practices; 3) To become familiar with some of the best practices in digital marketing; 4) To learn how to create and present a new business idea in the digital marketing space to the VC community.","prerequisites":["Prerequisites: Full-time MBA. Co-requisite: COR1-GB 2310.","Prerequisites: Focused MBA. Co-requisite: COR1-GB 2110.","Prerequisites: Part-time MBA and COR1-GB 2310.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"30","class_nbr":1835,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 6:00 pm - 9:00 pm","dates":"03/29-05/03"}],"instructors":[{"name":"Coleman,G","full_name":"Gregory Coleman","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Digital Media Innovation","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":346,"respondents":243,"response_rate":0.702,"scores":{"Goals clear":4.48,"Assignments effective":4.35,"Diverse perspectives":4.67,"Hours/week outside class":0.2,"Instructor clear on expectations":4.67,"Instructor explains concepts":4.57,"Feedback helpful":4.14,"Inclusive environment":4.7,"Course overall":4.74,"Intellectually stimulating":4.68,"Instructor overall":4.74}}}],"notes":null}]},{"course_code":"MKTG-GB.2130","title":"Innovation and Marketing in Pharma and Consumer Healthcare","units":1.5,"department":"Marketing","schedule_department":"Marketing","specializations":["Healthcare","Marketing"],"description":"Health is the foundation of all things in this life. Scientists, researchers, and healthcare professionals (HCP) are relentlessly pursuing innovative solutions in preventing and curing health issues. According to CDC, the US healthcare expenditures increased steeply and reached over 4 trillion dollars. Americans spent over 600 billion on medicine, which includes over the counter (OTC), pharmaceutical and biotech products. There are many challenges impacting consumers/patients, healthcare professionals, drug manufacturers, payers, and government regulators. For instance, as a consumer/patient, have you struggled to schedule a doctor appointment in time, to understand more about your choices for medicines and treatments, and to manage unknown and high medical bills? Additionally, people want to take more control of their own health, therefore we continue to see a booming market for consumer healthcare OTC products, digital healthcare products and wearable devices. On the other hand, pharmaceuticals are facing challenges of limited patent protection period and strong demand to develop the next big therapy. Also, how could pharma and biotech reduce the high probability of failure and cost in drug development? As commercial models are evolving, how to effectively reach and engage HCP and patients becomes more and more critical. Disruptive innovations in therapy are changing market dynamics and infrastructures, such as new diagnostics, drug delivery systems and disease awareness education and campaigns. In this course, we are on the journey to discuss these issues and possible solutions primarily through a marketing/commercial lens. Students will learn how to apply core principles of marketing, innovation, and new product development to the unique complexities of the consumer healthcare (OTC), pharmaceutical and biotech industries.","prerequisites":["Prerequisites: Full-time MBA. Co-requisite: COR1-GB 2310.","Prerequisites: Focused MBA. Co-requisite: COR1-GB 2110.","Prerequisites: Part-time MBA and COR1-GB 2310.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"30","class_nbr":1834,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"03/24-04/28"}],"instructors":[{"name":"Yang,R","full_name":"Rui Yang","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Innov & Mktg In Pharma Hthcare","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":82,"respondents":54,"response_rate":0.659,"scores":{"Goals clear":4.37,"Assignments effective":4.27,"Diverse perspectives":4.69,"Hours/week outside class":0.33,"Instructor clear on expectations":4.53,"Instructor explains concepts":4.38,"Feedback helpful":4.09,"Inclusive environment":4.82,"Course overall":4.6,"Intellectually stimulating":4.52,"Instructor overall":4.57}}}],"notes":null}]},{"course_code":"MKTG-GB.2142","title":"The Craft and Commerce of Cinema: Cannes Film Festival I","units":1.5,"department":"Marketing","schedule_department":"Marketing","specializations":["Entertainment, Media & Technology","Global Business","Marketing"],"description" :1.5,"department":"Marketing","schedule_department":"Marketing","specializations":["Brand Management","Entertainment, Media & Technology","Management","Management of Technology & Operations","Marketing","Tech Product Management"],"description":"Technology is pervasive across virtually every industry. Tech is no longer a vertical and now requires workers to be well versed in how to develop, create and manage technology either as a business or a key element thereof. The modern approach to technology development and management arose out of entrepreneurial technology ventures which are now some of the largest companies in the world. Even at scale, those companies are still nimble and innovative -- let alone the next generation of them which are constantly emerging. This, plus the fact that technology is now in now important in every industry, has incumbents scrambling to be competitive. One way they are doing this is hiring people with technology experience. However, they are also re-organizing into product-customer centric iterative and experimental technology organizations. There has never been more competition for tech workers. In the 21st century organization -- learning from tech companies -- the key roles revolve around engineering (software & hardware), design, data science and product management. Of the four, the first three have advanced academic program but the last, product management, has no academic offering meaning workers must gain knowledge and experience on the job. The trap is that most PM jobs require experience. Those trying to break into a tech role as a PM cannot easily gain that. This course is designed to cover advanced topics and scenarios a product manager faces in the real world across a wide variety of product types, industries and organizational structures ranging from startups to large organizations. Building on the fundamentals covered in Tech Product Management (MKTG-GB.2191), this course advances on the tools, techniques, best practices and real world situations for what a product manager faces in trying to deliver against product, company and user objectives.","prerequisites":["Prerequisites: MBA and MKTG-GB 2191","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"30","class_nbr":1833,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"03/25-04/29"}],"instructors":[{"name":"Breen,A","full_name":"Andrew Breen","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Tech Product Management Ii","sections_evaluated":6,"terms":"2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":333,"respondents":227,"response_rate":0.682,"scores":{"Goals clear":4.5,"Assignments effective":4.15,"Diverse perspectives":4.26,"Hours/week outside class":1.15,"Instructor clear on expectations":4.41,"Instructor explains concepts":4.37,"Feedback helpful":3.98,"Inclusive environment":4.3,"Course overall":4.29,"Intellectually stimulating":4.37,"Instructor overall":4.4}}}],"notes":null}]},{"course_code":"MKTG-GB.2326","title":"Luxury Marketing","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Luxury Marketing","Marketing"],"description":"The course is designed to provide students with an understanding of the fundamentals of luxury. When was the concept of luxury first articulated and what did it mean within its various manifestations? Who were the luxury consumers in pre-modern cultures and what were the events that catapulted luxury into the sociopolitcal discourse? How did modernity affect ancient processes associated with the production of luxury products? How did the products, consumer tastes, material exchanges, and producer strategies evolve through history? Students will acquire an understanding of the luxury segment of the market as it applies to a variety of industries; observation skills that will allow them to distinguish what constitutes luxury in a product; the necessary vocabulary to articulate the nuances that differentiate these products and the ability to do so with clarity and precision in terms of technique, design, and materials; and finally, the critical skills to identify potential new luxury products and how they relate to a variety of markets, including emerging markets.","prerequisites":["Prerequisites: MBA student and COR1-GB 2310.","Prerequisites: Focused MBA student and COR1-GB 2110.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"30","class_nbr":1838,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 6:00 pm - 9:00 pm","dates":"02/01-05/03"}],"instructors":[{"name":"Serdari,T","full_name":"Thomai Serdari","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Luxury Marketing","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":188,"respondents":130,"response_rate":0.691,"scores":{"Goals clear":4.54,"Assignments effective":4.41,"Diverse perspectives":4.47,"Hours/week outside class":0.8300000000000001,"Instructor clear on expectations":4.51,"Instructor explains concepts":4.44,"Feedback helpful":4.28,"Inclusive environment":4.47,"Course overall":4.48,"Intellectually stimulating":4.51,"Instructor overall":4.54}}}],"notes":null}]},{"course_code":"MKTG-GB.2344","title":"Data Driven Decision Making: Managerial","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Brand Management","Business Analytics","Digital Marketing","Management","Management of Technology & Operations","Marketing","Tech Product Management"],"description":"The specific objectives of this course are to: 1. Help you understand how analytical techniques and statistical models can help enhance decision making by converting data to information and insights for decision-making; 2. Provide intuition for data- driven decision making by using practical examples from a wide spectrum of fields; 3. Provide insight into how to choose and use the most effective statistical tool based on the problem at hand; 4. Provide you with a software tool kit that will enable you to apply statistical models to real decision problems; 5. Most importantly, remove any fear of data analysis and increase your comfort level with analyzing databases most commonly used in the business world.","prerequisites":["Prerequisite: MBA Student and COR1-GB 1305.","Prerequisite: Focused MBA and (COR1-GB 1105 or Co-Requisite TECH-2147).","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"20","class_nbr":1843,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 10:30 am - 11:50 am","dates":"01/25-05/03"}],"instructors":[{"name":"Lee,J","full_name":"Jack Lee","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Data Driven Decision Making: M","sections_evaluated":7,"terms":"2023U, 2024S, 2024U, 2025S, 2026S","latest_term":"2026S","enrolled":271,"respondents":187,"response_rate":0.69,"scores":{"Goals clear":4.49,"Assignments effective":4.41,"Diverse perspectives":4.28,"Hours/week outside class":1.37,"Instructor clear on expectations":4.53,"Instructor explains concepts":4.35,"Feedback helpful":4.21,"Inclusive environment":4.6,"Course overall":4.17,"Intellectually stimulating":4.38,"Instructor overall":4.5}}}],"notes":null}]},{"course_code":"MKTG-GB.2349","title":"Retaining Customers","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Marketing"],"description":"According to research from Harvard Business School, increasing customer retention rates by 5 percent increases profits by 25 percent to 95 percent. Marketers and business leaders must understand the profound impact customer retention has on the profitability of the organization. They must deconstruct their organizations' retention drivers and qualify and quantify the relationship between product quality, service experience, relationship management and loyalty. Then they must act on those findings. Research studies of service companies across industries show correlations between loyalty- leading companies and performance: their topline growth rates and shareholder returns are greater than companies with average loyalty scores. Loyalty leaders also exhibit lower expenses compared to their loyalty-lagging peers. The objectives of this course are therefore to: • Recognize the impetus for retention and loyalty as a marketing discipline understanding the impact of retention and loyalty on growth and profitability • Define and apply customer retention principles o Voice of the customer o Customer experience design o Problem resolution, root cause analysis and recovery o Relationship management and customer engagement programs • Calculate customer lifetime value and model loyalty economics • Evaluate and design appropriate programs to decrease churn and increase retention • Identify structural and cultural organizational barriers to success and design interventions","prerequisites":["Prerequisites: MBA student and COR1-GB 2310.","Prerequisites: Focused MBA student and COR1-GB 2110.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"30","class_nbr":1848,"instruction_mode":"Online","alternate_schedule":false,"meetings":[{"days_time":"M 7:00 pm - 9:00 pm","dates":"02/01-05/03"}],"instructors":[{"name":"Ishihara,M","full_name":"Masakazu Ishihara","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Retaining Customers","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":91,"respondents":53,"response_rate":0.582,"scores":{"Goals clear":4.28,"Assignments effective":4.06,"Diverse perspectives":4.45,"Hours/week outside class":0.47000000000000003,"Instructor clear on expectations":4.52,"Instructor explains concepts":4.45,"Feedback helpful":4.31,"Inclusive environment":4.8,"Course overall":3.92,"Intellectually stimulating":4.02,"Instructor overall":4.45}}}],"notes":"Online"}]},{"course_code":"MKTG-GB.2350","title":"Marketing Planning & Strategy","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Brand Management","Luxury Marketing","Marketing"],"description":"Developing business and marketing strategies and tactics is a fundamental skill required of all business professionals. That is why Stern offers many courses to assist you in these areas. Business and marketing plan documents drive companies. If you specialize in marketing, finance, strategy, general management, or entrepreneurship, you will need to lead or help develop a business/marketing plan. This course aims to consolidate your learning from other Stern MBA courses to develop that material into a cohesive and actionable Business / Marketing Plan and get the plan approved in the Boardroom.","prerequisites":["Prerequisites: Full-time MBA. Co-requisite: COR1-GB 2310.","Prerequisites: Focused MBA. Co-requisite: COR1-GB 2110.","Prerequisites: Part-time MBA and COR1-GB 2310.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"20","class_nbr":1839,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"TR 3:00 pm - 4:20 pm","dates":"01/26-05/04"}],"instructors":[{"name":"Krentzman,S","full_name":"Stewart Krentzman","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Marketing Planning & Strategy","sections_evaluated":8,"terms":"2023U, 2024S, 2024U, 2025S, 2025U, 2026S, 2026U","latest_term":"2026U","enrolled":387,"respondents":268,"response_rate":0.693,"scores":{"Goals clear":4.63,"Assignments effective":4.5,"Diverse perspectives":4.47,"Hours/week outside class":1.0,"Instructor clear on expectations":4.57,"Instructor explains concepts":4.49,"Feedback helpful":4.56,"Inclusive environment":4.65,"Course overall":4.47,"Intellectually stimulating":4.4,"Instructor overall":4.58}}}],"notes":null}]},{"course_code":"MKTG-GB.2353","title":"Pricing","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Brand Management","Luxury Marketing","Management of Technology & Operations","Marketing","Supply Chain Management & Global Sourcing","Tech Product Management"],"description":"Pricing is one of the most important but least understood marketing decisions. This course is designed to equip participants with the framework's techniques and latest thinking on assessing and formulating pricing strategies. We will learn the process of making pricing decisions and explore innovative approaches for setting prices. The emphasis of the course is on ways in which you can help firms in diverse industries to improve their pricing. The topics of discussion include pricing of durable goods, pricing of consumer package goods, pricing of service, pricing of informational goods, new product pricing, price promotions, behavior based pricing, price bundling, nonlinear pricing, targeted pricing through a distribution channel, dynamic pricing, etc. Course work consists of in class discussion case studies and teamwork. Upon successful completion of this course you will a) gain a solid understanding of pricing practices across different industries b) learn state of the art frameworks for analyzing pricing issues and c) master the essential techniques for making profitable pricing decisions with strategic thinking.","prerequisites":["Prerequisites: Full-time MBA. Co-requisite: COR1-GB 2310.","Prerequisites: Focused MBA. Co-requisite: COR1-GB 2110.","Prerequisites: Part-time MBA and COR1-GB 2310.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"20","class_nbr":1840,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"TR 9:00 am - 10:20 am","dates":"01/26-05/04"}],"instructors":[{"name":"Ishihara,M","full_name":"Masakazu Ishihara","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Pricing","sections_evaluated":4,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":252,"respondents":171,"response_rate":0.679,"scores":{"Goals clear":4.6,"Assignments effective":4.62,"Diverse perspectives":4.63,"Hours/week outside class":0.7400000000000001,"Instructor clear on expectations":4.75,"Instructor explains concepts":4.67,"Feedback helpful":4.5,"Inclusive environment":4.78,"Course overall":4.55,"Intellectually stimulating":4.45,"Instructor overall":4.7}}}],"notes":null}]},{"course_code":"MKTG-GB.2356","title":"AI in Marketing Analytics","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Artificial Intelligence","Brand Management","Entertainment, Media & Technology","Marketing"],"description":"This course introduces students to the strategic and practical applications of artificial intelligence (AI) in marketing analytics. A foundation of Python is necessary for the course. Grounded in core marketing challenges, the course examines how AI tools — across descriptive, predictive, prescriptive, and generative categories — can enhance marketing strategies. Students will gain hands-on experience using state-of-the-art AI technologies to solve real-world marketing problems, such as customer segmentation, social listening, churn prediction, A/B testing, and branded content generation. Beyond technical capabilities, the course emphasizes the strategic choices marketing leaders face when adopting AI systems, including questions of implementation, interpretability, and cross- functional alignment. Students will analyze how AI-generated outputs are perceived by consumers and managers, and evaluate their implications for brand equity, customer trust, and organizational performance. Special attention is given to generative AI's impact on creativity and marketing workflows. The course also engages students in the ethical, regulatory, and societal dimensions of AI in marketing — addressing challenges such as algorithmic bias, fairness, explainability, and governance. By the end of the course, students will be equipped to lead AI-driven marketing initiatives with both strategic insight and critical responsibility.","prerequisites":["Prerequisite: MBA Student and COR1-GB 1305.","Prerequisite: Focused MBA and (COR1-GB 1105 or Co-Requisite TECH-2147).","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"20","class_nbr":4401,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 1:30 pm - 4:20 pm","dates":"01/25-05/03"}],"instructors":[{"name":"Papatla,P","full_name":"Purushottam Papatla","full_name_source":"schedule notes","name_source":"schedule notes","evaluation_2023_2026":null}],"notes":"Instructor: Purushottam Papatla"}]},{"course_code":"MKTG-GB.2365","title":"Brand Strategy","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Brand Management","Luxury Marketing","Marketing"],"description":"Brand planners/strategists face many challenges including how to: 1. Create a comprehensive brand architecture that will provide strategic direction; 2. Generate motivating brand identities and value propositions for the key brands; 3. Develop brand- building programs; and 4. Leverage new technologies. The goal of this course is to provide concepts models methods and role models that will help address these challenges.","prerequisites":["Prerequisites: Full-time MBA. Co-requisite: COR1-GB 2310.","Prerequisites: Focused MBA. Co-requisite: COR1-GB 2110.","Prerequisites: Part-time MBA and COR1-GB 2310.","Not open to students with more than 24 MKTG-GB units."],"sections":[{"section":"20","class_nbr":1842,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 3:00 pm - 4:20 pm","dates":"01/25-05/03"}],"instructors":[{"name":"Gormley,F","full_name":"Fran Gormley","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Brand Strategy","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":170,"respondents":123,"response_rate":0.724,"scores":{"Goals clear":4.5,"Assignments effective":4.39,"Diverse perspectives":4.29,"Hours/week outside class":0.6900000000000001,"Instructor clear on expectations":4.39,"Instructor explains concepts":4.46,"Feedback helpful":4.35,"Inclusive environment":4.36,"Course overall":4.4,"Intellectually stimulating":4.39,"Instructor overall":4.46}}}],"notes":null}]},{"course_code":"MKTG-GB.2368","title":"Consulting Lab: Branding & Innovation","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Brand Management","Luxury Marketing","Marketing"],"description":"This course is designed for advanced MBA students seeking real world brand consulting experience. Students will work in teams to solve critical global branding challenges facing partner organizations such as IBM and MasterCard. This experiential learning lab will be by faculty with extensive consulting experience, who will coach teams and oversee partnerships with clients. Client organizations have been carefully recruited and branding projects vetted to ensure students have a meaningful experience developing creative branding strategies to catapult the business forward. The final deliverable is a client presentation with actionable, well-developed branding recommendations. Students will learn global branding frameworks and concepts as well as valuable consulting skills, including managing complex projects, enhancing team dynamics, building client relationships, and optimizing presentation skills. Students will be required to sign standard information disclosure and work product ownership agreements. NOTE: In some cases, clients will ask students to sign confidentially agreements and/or assign intellectual property rights.","prerequisites":["Pre-req: Full-time MBA & COR1-GB.2103,COR1-GB.2104 Co-req:COR1-GB 2310","Pre-req: Focused MBA & COR1-GB 2101. Co-requisite: COR1-GB 2110","Pre-req: Part-time MBA & COR1-GB 2103, COR1-GB 2104 & COR1-GB 2310","Not open to students with more than 24 MKTG-GB units"],"sections":[{"section":"30","class_nbr":2010,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"02/03-04/28"}],"instructors":[{"name":"Kuehlwein,J","full_name":"JP Kuehlwein","full_name_source":"web (NYU Stern site)","name_source":"schedule","evaluation_2023_2026":null},{"name":"Black,J","full_name":null,"full_name_source":null,"name_source":"schedule","evaluation_2023_2026":null}],"notes":null}]},{"course_code":"MKTG-GB.2371","title":"Innovation and Design","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Brand Management","Entrepreneurship and Innovation","Luxury Marketing","Marketing","Strategy","Tech Product Management"],"description":"Many firms that have experienced dramatic gains in shareholder value over the last few years(e.g. Google Apple Motorola) register innovation as a central driver of their progress. One can argue that innovation and a culture that inspires and supports innovation is the only sustainable competitive advantage. A frequent manifestation of recent innovation has been breakthrough design. Design represents a powerful alternative to the dominant management approaches of the last few decades and is an important perspective for leadership to embrace.","prerequisites":["MKTG-GB Departmental Max or Non-Stern"],"sections":[{"section":"30","class_nbr":1845,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"02/04-04/29"}],"instructors":[{"name":"Williams,L","full_name":"Luke Williams","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Innovation And Design","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":186,"respondents":106,"response_rate":0.57,"scores":{"Goals clear":4.36,"Assignments effective":4.33,"Diverse perspectives":4.37,"Hours/week outside class":0.91,"Instructor clear on expectations":4.29,"Instructor explains concepts":4.46,"Feedback helpful":4.16,"Inclusive environment":4.53,"Course overall":4.29,"Intellectually stimulating":4.43,"Instructor overall":4.39}}}],"notes":null}]},{"course_code":"MKTG-GB.2376","title":"Next Gen Fashion","units":3.0,"department":"Marketing","schedule_department":"Marketing","specializations":["Brand Management","Luxury Marketing","Marketing"],"description":"The fashion industry will undergo more changes in the next 10 years than it has in the past 100 as technology disrupts every aspect of the business. Traditionally, conversations between brands and their customers have been held in a brand's store or on behalf of brands by their retailers and distributors. Now, this conversation is held directly with customers every second of every day through innumerable direct and indirect online and offline channels. At the same time traditional media, primarily magazines (Vogue, Elle, InStyle, etc), are all struggling with these new channels and their role in creating fashion brands while companies find new ways to manufacture and ship their goods and services around the world. Using industry experts as guest speakers, lectures/discussions, case studies and consulting by the course faculty, students will learn the ins and outs of the fashion industry. It is an opportunity to marry the theory and process learned in the core classes, with the reality of running real businesses in a very creative and dynamic industry. Each speaker appearance will be combined with readings and form the basis for the final project assignment. The basic format of the class is: listen/discuss/learn/do. This will be a highly interactive class with an emphasis on participation and application.","prerequisites":["MKTG-GB Departmental Max or Non-Stern"],"sections":[{"section":"30","class_nbr":1846,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"02/04-04/29"}],"instructors":[{"name":"Serdari,T","full_name":"Thomai Serdari","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Next Gen Fashion","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":123,"respondents":84,"response_rate":0.683,"scores":{"Goals clear":4.63,"Assignments effective":4.54,"Diverse perspectives":4.71,"Hours/week outside class":0.9700000000000001,"Instructor clear on expectations":4.65,"Instructor explains concepts":4.68,"Feedback helpful":4.44,"Inclusive environment":4.73,"Course overall":4.63,"Intellectually stimulating":4.61,"Instructor overall":4.75}}}],"notes":null}]},{"course_code":"OPMG-GB.2306","title":"Supply Chain Management (Business Logistics)","units":3.0,"department":"Operations Management","schedule_department":"Operations Management","specializations":["Luxury Marketing","Management of Technology & Operations","Marketing","Supply Chain Management & Global Sourcing"],"description":"The function of supply chain management is to design and manage the flow of material and information, starting from the raw materials until finished goods reach customers. Typically, logistics-related costs account for 20 to 25 percent of firms' total costs. On the revenue side, the supply chain decisions have a direct impact on market penetration and customer service. With the globalization of the economy and advances in information technology, supply chain design and coordination have become important tools for gaining competitive advantage. Therefore, the objectives of the course are to (1) develop an understanding of individual components of the supply chain (such as order management transportation, network design, distribution channel management, after-sales service, and customer service strategy) and their interrelationships with other functions of firms, such as marketing, manufacturing, and accounting; (2) impart analytical and problem-solving skills necessary to develop solutions for a variety of logistics problems; (3) understand the complexity of interfirm and intrafirm coordination in implementing programs such as \"quick response\" and \"vendor-managed inventories\" and (4) develop the ability to design logistics systems and formulate integrated supply chain strategy, so that all components are not only internally synchronized but also tuned to fit corporate strategy, competitive realities, and market needs.","prerequisites":["Prerequisites: MBA student and COR1-GB 2314.","Not open to students with more than 24 OPMG-GB units."],"sections":[{"section":"30","class_nbr":2050,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 6:00 pm - 9:00 pm","dates":"02/01-05/03"}],"instructors":[{"name":"Hellriegel,J","full_name":"John Hellriegel","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Supply Chain Management (Busin","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":49,"respondents":33,"response_rate":0.673,"scores":{"Goals clear":4.7,"Assignments effective":4.25,"Diverse perspectives":4.56,"Hours/week outside class":0.8800000000000001,"Instructor clear on expectations":4.65,"Instructor explains concepts":4.53,"Feedback helpful":4.16,"Inclusive environment":4.62,"Course overall":4.31,"Intellectually stimulating":4.45,"Instructor overall":4.51}}}],"notes":"This course is cross-listed with the undergraduate school."}]},{"course_code":"OPMG-GB.2312","title":"Operations in Panama: A Man, A Plan, A Canal: Panama","units":3.0,"department":"Operations Management","schedule_department":"Operations Management","specializations":["Global Business","Management of Technology & Operations","Supply Chain Management & Global Sourcing"],"description":"This advanced elective from the IOMS department will be a three (3) credit course studying the major businesses operating in Panama. During a one-week visit, students will observe and study the intricacies of the Panama Canal from an operations management point of view. Process techniques and strategies abound within this fascinating operation. Although the canal is certainly the country's major attraction, financial revenues from the canal have allowed Panama to emphasize other developments including extensive real estate projects and major tourism improvements. The specific topics that will be studied include: * The Panama Canal and its effect on the global shipping supply chain, * History of the building of the canal and independence of Panama, * Modern banking and real estate development, * Economic growth in the tourism industry, * Urban development and infrastructure of major cities. All of the classes, tours, speaker sessions and group meetings must be attended by students for course credit. No exceptions. The course will be limited in enrollment. Details will be announced.","prerequisites":["Co-requisites: MBA student and COR1-GB 2314.","Not open to students with more than 24 OPMG-GB units."],"sections":[{"section":"D1","class_nbr":2049,"instruction_mode":"In-Person","alternate_schedule":true,"meetings":[{"days_time":"M 4:50 pm - 5:50 pm","dates":"02/01-02/01"},{"days_time":"M 6:00 pm - 7:00 pm","dates":"03/01-03/01"},{"days_time":"MTWRFSaSu 9:00 am - 9:00 pm","dates":"03/14-03/20"},{"days_time":"M 6:00 pm - 9:00 pm","dates":"03/29-03/29"}],"instructors":[{"name":"Chernoff,H","full_name":"Harry G. Chernoff","full_name_source":"evaluations (same course)","name_source":"schedule","eval learn how to model business problems and solve them in Excel. In addition, you will learn how to construct and solve optimization and simulation models. The Class is 100% focused on hands-on problem solving. More details available at https://sites.google.com/stern.nyu.edu/sterndma/home.","prerequisites":["OPMG-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":2048,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 9:00 am - 10:20 am","dates":"01/25-05/03"}],"instructors":[{"name":"Zhang,J","full_name":"Jiawei Zhang","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Decision Models And Analytics","sections_evaluated":1,"terms":"2023F","latest_term":"2023F","enrolled":37,"respondents":25,"response_rate":0.676,"scores":{"Goals clear":4.6,"Assignments effective":4.4,"Diverse perspectives":4.0,"Hours/week outside class":1.9,"Instructor clear on expectations":4.6,"Instructor explains concepts":4.3,"Feedback helpful":4.0,"Inclusive environment":4.4,"Course overall":4.4,"Intellectually stimulating":4.6,"Instructor overall":4.4}}}],"notes":null},{"section":"21","class_nbr":2053,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 10:30 am - 11:50 am","dates":"01/25-05/03"}],"instructors":[{"name":"Zhang,J","full_name":"Jiawei Zhang","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Decision Models And Analytics","sections_evaluated":1,"terms":"2023F","latest_term":"2023F","enrolled":37,"respondents":25,"response_rate":0.676,"scores":{"Goals clear":4.6,"Assignments effective":4.4,"Diverse perspectives":4.0,"Hours/week outside class":1.9,"Instructor clear on expectations":4.6,"Instructor explains concepts":4.3,"Feedback helpful":4.0,"Inclusive environment":4.4,"Course overall":4.4,"Intellectually stimulating":4.6,"Instructor overall":4.4}}}],"notes":null}]},{"course_code":"OPMG-GB.2360","title":"Real Estate Development and Entrepreneurship","units":3.0,"department":"Operations Management","schedule_department":"Operations Management","specializations":["Financial Systems & Analytics","Management of Technology & Operations","Real Estate","Strategy","Supply Chain Management & Global Sourcing"],"description":"This course will introduce students to the broad aspects of real estate development from an operations perspective. It is directed to students interested in real estate development from the point of view of three classes of investors: * an entrepreneurial investor, looking to buy a coop, condo or small property for individual use or rental * a working general partner of a small group of investors, who will actually manage and-or be responsible for overseeing the property after purchase * a passive outside investor, who may be searching for an investment that is limited in liability to the original investment. In real estate development, operating decisions will determine whether or not a deal will be successful and meet overall financial goals. Although most students will not work full-time in the real estate industry, property investments will arise as opportunities to increase passive income and wealth. Understanding how these deals are created and managed will allow investors to choose deals with the highest probability of success. The real estate topics discussed in the course will include all types of development: residential, hotel, office, retail, land and industrial properties. In addition to case studies, class lectures and discussions, some outstanding entrepreneurial developers will be invited as guest speakers to reinforce the ideas taught in class. The class will include a real estate development project, with group presentations to the class and potential outside investors.","prerequisites":["OPMG-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":2054,"instruction_mode": avigate through the hazards and opportunities you will face in your career. Specifically: 1) You will learn about the types of traps that lure business professionals into ethical lapses and criminal behaviors. 2) You will learn enough moral psychology to understand how well-intentioned professionals can get lured into such traps. 3) You will learn conceptual frameworks that help you to navigate ethical gray zones with more confidence and better results. 4) You will learn what characterizes companies with positive ethical values, and why you are better off working for them, or creating them. 5) You may, if you choose, commit yourself to a standard of professional conduct that will help to make your work more fulfilling and honorable.","prerequisites":[],"sections":[{"section":"F1","class_nbr":1821,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"FSaSu 9:00 am - 4:00 pm","dates":"01/22-01/24"}],"instructors":[{"name":"Taparia,H","full_name":"Hans Taparia","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Prof & Corp Social Resp","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":63,"respondents":40,"response_rate":0.635,"scores":{"Goals clear":4.65,"Assignments effective":4.31,"Diverse perspectives":4.97,"Hours/week outside class":1.24,"Instructor clear on expectations":4.87,"Instructor explains concepts":4.94,"Feedback helpful":4.5,"Inclusive environment":4.97,"Course overall":4.58,"Intellectually stimulating":4.71,"Instructor overall":4.9}}}],"notes":"Focused - Luxury & Retail"}]},{"course_code":"COR2-GB.3151","title":"Professional Responsibility in Tech","units":1.5,"department":"Professional Responsibility","schedule_department":"Professional Responsibility","specializations":[],"description":"This course is designed to inspire you with a positive vision of what business can be, a realistic vision of what it often is, and a roadm
