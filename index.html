<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Stern Spring 2027 Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F3F7; --surface:#FFFFFF; --surface-2:#F8F7FB; --ink:#17151F; --muted:#5E5A6E; --faint:#8C889B;
  --line:#E2DFEA; --line-strong:#CBC6D8; --accent:#57068C; --accent-soft:#EFE6F7; --accent-ink:#FFFFFF;
  --star:#D99A00; --good:#1D7A4D; --good-bg:#E3F4EA; --mid:#6B5E00; --mid-bg:#F6F0CF; --warn:#A23B1C; --warn-bg:#FBE6DE;
  --chip-s:62%; --chip-l:91%; --chip-ts:55%; --chip-tl:27%; --chip-on-s:52%; --chip-on-l:42%;
  --bar:#57068C; --bar-bg:#ECE9F2; --amber:#B3401A; --amber-bg:#FDE1D5; --term-bg:#E9E8EC; --term-ink:#4A4757;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121019; --surface:#1B1824; --surface-2:#211E2C; --ink:#ECE9F4; --muted:#A9A3BA; --faint:#7C768E;
    --line:#2D2939; --line-strong:#3E394D; --accent:#B98AE6; --accent-soft:#2C2240; --accent-ink:#17121F;
    --star:#F2B632; --good:#6FD39E; --good-bg:#16311F; --mid:#E4CF6A; --mid-bg:#302B12; --warn:#F09A7C; --warn-bg:#3A1C13;
    --chip-s:32%; --chip-l:21%; --chip-ts:70%; --chip-tl:80%; --chip-on-s:55%; --chip-on-l:60%;
    --bar:#B98AE6; --bar-bg:#2D2939; --amber:#F4876A; --amber-bg:#40201A; --term-bg:#2C2A33; --term-ink:#C7C3D1;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121019; --surface:#1B1824; --surface-2:#211E2C; --ink:#ECE9F4; --muted:#A9A3BA; --faint:#7C768E;
  --line:#2D2939; --line-strong:#3E394D; --accent:#B98AE6; --accent-soft:#2C2240; --accent-ink:#17121F;
  --star:#F2B632; --good:#6FD39E; --good-bg:#16311F; --mid:#E4CF6A; --mid-bg:#302B12; --warn:#F09A7C; --warn-bg:#3A1C13;
  --chip-s:32%; --chip-l:21%; --chip-ts:70%; --chip-tl:80%; --chip-on-s:55%; --chip-on-l:60%;
  --bar:#B98AE6; --bar-bg:#2D2939; --amber:#F4876A; --amber-bg:#40201A; --term-bg:#2C2A33; --term-ink:#C7C3D1;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 32px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:12.5px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-variant-numeric:tabular-nums}
.stat b{font-size:16px}
.stat span{color:var(--muted);font-size:12px}
.stat.star b{color:var(--star)}
.filters-toggle{display:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding-top:16px;align-items:start}
aside.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.search{position:relative}
.search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
details.fg{border-top:1px solid var(--line);padding-block:10px 4px}
details.fg:first-of-type{border-top:0}
details.fg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-bottom:8px}
details.fg>summary::-webkit-details-marker{display:none}
details.fg>summary .caret{transition:transform .15s}
details.fg[open]>summary .caret{transform:rotate(90deg)}
.fg .badge{font-size:10.5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;letter-spacing:0;text-transform:none}
.fg-body{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.row-actions{display:flex;gap:10px;font-size:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.linkbtn:hover{text-decoration:underline}

.chip{--h:260;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) var(--chip-ts) var(--chip-tl));border:1px solid transparent}
.spec-chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{cursor:pointer;opacity:.9;white-space:normal;text-align:left;max-width:100%}
button.chip:hover{opacity:1;border-color:hsl(var(--h) var(--chip-ts) var(--chip-tl) / .35)}
button.chip.on{background:hsl(var(--h) var(--chip-on-s) var(--chip-on-l));color:#fff;opacity:1}
:root[data-theme="dark"] button.chip.on{color:#120F18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.chip.on{color:#120F18}}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;font-size:11px}
.check .chip{white-space:normal;line-height:1.3;border-radius:9px}
.more-btn{align-self:flex-start;font-size:12px}
#specMore[hidden]{display:none}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 9px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:13px}
.check:hover{background:var(--surface-2)}
.check input{accent-color:var(--accent);margin:0;width:15px;height:15px}
.check .lbl{flex:1}
.check .n{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.tg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:11.5px;color:var(--faint)}
.range{display:flex;align-items:center;gap:10px}
.range input[type=range]{flex:1;accent-color:var(--accent)}
.range output{font-family:var(--mono);font-size:12.5px;min-width:34px;text-align:right}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.switch input{accent-color:var(--star);width:15px;height:15px;margin:0}

main{min-width:0;display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.count{font-weight:600}
.count span{color:var(--muted);font-weight:400}
.toolbar .sort{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.toolbar select{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:5px 8px}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.active:empty{display:none}
.af{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px}
.af.chip{border:0;padding:2px 4px 2px 10px}
.af button{border:0;background:transparent;cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:inherit;opacity:.7}
.af button:hover{opacity:1;background:var(--line)}

.list{display:flex;flex-direction:column;gap:8px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.course.starred{border-color:color-mix(in srgb,var(--star) 55%,var(--line))}
.course.open{border-color:var(--line-strong)}
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px 12px 8px;cursor:pointer;align-items:start}
.head:hover{background:var(--surface-2)}
.starbtn{border:0;background:transparent;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--faint)}
.starbtn:hover{background:var(--line)}
.starbtn.on{color:var(--star)}
.starbtn svg{width:20px;height:20px}
.main-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.title-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.code{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.ttl{font-size:15px;font-weight:600;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.meta .sep{display:inline-flex;align-items:center;gap:5px}
.term{font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:5px;padding:1px 6px;background:var(--term-bg);color:var(--term-ink)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pills{display:flex;gap:6px}
.pill{display:inline-flex;flex-direction:column;align-items:center;width:58px;border-radius:7px;padding:3px 7px;font-variant-numeric:tabular-nums;line-height:1.15}
.pill b{font-size:14px}
.pill small{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.pill{border:1px solid transparent}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.mid{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.pill.mid small{color:var(--muted);opacity:1}
.pill.low{background:var(--amber-bg);color:var(--amber)}
.pill.none{background:var(--surface-2);color:var(--faint);border:1px dashed var(--line-strong)}
.load{display:inline-grid;grid-template-columns:auto auto;grid-template-areas:'ll ll' 'dots lv';justify-content:start;align-items:center;gap:3px 7px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.load .ll{grid-area:ll}
.load .lv{grid-area:lv}
.load .dots{grid-area:dots}
.load .ll{color:var(--faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em}
.load .dots{display:inline-flex;gap:2px}
.load .dots i{display:inline-block;width:11px;height:6px;border-radius:3px;background:var(--bar-bg)}
.load .dots i.f{background:var(--faint)}
.load .lv{color:var(--muted);font-weight:500}
.tstat{display:inline-flex;align-items:baseline;gap:6px;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.tstat b{color:var(--ink);font-weight:600}
.tstat .si{color:var(--star)}
.core{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-right:6px;background:var(--accent);color:var(--accent-ink)}
.secstar{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:1px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.secstar.on{border-color:color-mix(in srgb,var(--star) 60%,var(--line));color:var(--star);font-weight:600}
.modal{position:fixed;inset:0;z-index:50;background:rgb(10 8 16 / .45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal-box{width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgb(0 0 0 / .25)}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-h h3{margin:0;font-size:16px;line-height:1.3}
.modal-x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.modal-sub{margin:0;color:var(--muted);font-size:13px}
.secopts{display:flex;flex-direction:column;gap:8px}
.secopt{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:10px;padding:10px 12px;cursor:pointer}
.secopt:hover,.secopt:focus-visible{border-color:var(--star);background:var(--surface)}
.so-h{display:flex;align-items:center;gap:8px}
.so-m{font-family:var(--mono);font-size:12px;color:var(--muted)}
.so-i{font-size:12.5px}
.modal-f{display:flex;justify-content:flex-end;gap:8px}
.ffoot{position:sticky;bottom:-14px;margin:6px -14px -14px;background:var(--surface);z-index:2}
.ffoot .si{color:var(--star)}
.ffoot b{font-size:18px;color:var(--ink)}
.chevron{color:var(--faint);transition:transform .15s}
.course.open .chevron{transform:rotate(180deg)}

.body{border-top:1px solid var(--line);padding:14px 16px 16px 50px;display:flex;flex-direction:column;gap:16px;background:var(--surface)}
.sec-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px}
.desc{margin:0;max-width:75ch;color:var(--ink)}
.desc a{color:var(--accent)}
.kv{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:13px}
.kv span{color:var(--muted)}
.sections{display:flex;flex-direction:column;gap:10px}
.section{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.section-top{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;font-variant-numeric:tabular-nums}
.section-top .k{color:var(--muted)}
.mtgs{display:flex;flex-direction:column;gap:2px;font-size:13px;font-family:var(--mono)}
.note{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:8px;overflow-wrap:anywhere}
.instr{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.instr-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.instr-h b{font-size:13.5px}
.instr-h .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:5px 24px}
.score{display:grid;grid-template-columns:minmax(0,1fr) 72px 36px;align-items:center;gap:8px;font-size:12px}
.score .l{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .tr{position:relative;height:6px;border-radius:3px;background:var(--bar-bg)}
.score .tr i{display:block;height:100%;background:var(--bar);border-radius:3px}
.score .tr b{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--surface-2);box-shadow:0 0 0 2px var(--ink)}
.score .v{font-family:var(--mono);text-align:right;font-size:12px}
.medkey{margin-left:10px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.medkey b{width:8px;height:8px;border-radius:50%;background:var(--surface-2);box-shadow:0 0 0 2px var(--ink)}
.score.hl .l{color:var(--ink);font-weight:600}
.noeval{font-size:12.5px;color:var(--faint);font-style:italic}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:10px}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside.filters{position:static;max-height:none}
  aside.filters.closed{display:none}
  .filters-toggle{display:inline-flex}
  header.top{position:static}
}
@media (max-width:560px){
  .head{grid-template-columns:auto minmax(0,1fr)}
  .right{grid-column:1 / -1;padding-left:8px;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:8px}
  .pills{gap:4px}
  .load .ll{letter-spacing:.03em}
  .load .lv{min-width:0}
  .right .chevron{display:none}
  .body{padding-left:14px}
  .score{grid-template-columns:minmax(0,1fr) 70px 34px}
}

/* tabs */
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
/* schedule */
:root{
  --t-full-bg:#EEE6F7; --t-full:#6B2BA8; --t-h1-bg:#DDF1ED; --t-h1:#1C7466; --t-h2-bg:#FBEED6; --t-h2:#A8690F;
  --t-int-bg:#ECEBEF; --t-int:#6E6A7C; --t-x-bg:#FCE1DB; --t-x:#C0341D; --t-x-ink:#8E2415; --grid:#ECEAF1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --t-full-bg:#2F2344; --t-full:#B98AE6; --t-h1-bg:#15322D; --t-h1:#5CC7B5; --t-h2-bg:#372B14; --t-h2:#E7B45A;
  --t-int-bg:#2A2833; --t-int:#A09BB0; --t-x-bg:#43201A; --t-x:#F07A62; --t-x-ink:#FFC2B5; --grid:#26222F;}}
:root[data-theme="dark"]{
  --t-full-bg:#2F2344; --t-full:#B98AE6; --t-h1-bg:#15322D; --t-h1:#5CC7B5; --t-h2-bg:#372B14; --t-h2:#E7B45A;
  --t-int-bg:#2A2833; --t-int:#A09BB0; --t-x-bg:#43201A; --t-x:#F07A62; --t-x-ink:#FFC2B5; --grid:#26222F;}
.tp-full{--c:var(--t-full);--cb:var(--t-full-bg)} .tp-h1{--c:var(--t-h1);--cb:var(--t-h1-bg)}
.tp-h2{--c:var(--t-h2);--cb:var(--t-h2-bg)} .tp-int{--c:var(--t-int);--cb:var(--t-int-bg)}
.sched{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding-top:16px;align-items:start}
.sbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 100px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sbar .search{padding:12px 12px 8px}
.sbar-actions{display:flex;gap:12px;padding:0 14px 8px;font-size:12px}
.slist{overflow:auto;flex:1;padding:0 6px 8px}
.sgroup-h{position:sticky;top:0;z-index:1;background:var(--surface);display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 8px 6px}
.sgroup-h .star-i{color:var(--star)}
.sdivider{height:0;border-top:2px solid var(--line-strong);margin:8px 8px 0}
.sitem{display:grid;grid-template-columns:auto 8px minmax(0,1fr) auto;gap:4px 8px;align-items:start;padding:7px 8px;border-radius:7px;cursor:pointer}
.sitem:hover{background:var(--surface-2)}
.sitem input{accent-color:var(--accent);margin:2px 0 0;width:15px;height:15px}
.sitem .dot{width:8px;height:8px;border-radius:2px;background:var(--c);margin-top:6px}
.sitem .t{font-size:13px;font-weight:500;line-height:1.3}
.sitem .m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.sitem .cr{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;margin-top:2px}
.sitem.x .t{color:var(--t-x)}

ncounter in their roles as managers of public and private companies consultants and entrepreneurs. Topics for discussion include but are not limited to contract and cyber laws; the various forms of business structures.partnerships corporations and limited liability companies business torts; product liability; and specific issues regarding entrepreneurs and employment law.","prerequisites":["BSPA-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":1797,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 1:30 pm - 2:50 pm","dates":"01/25-05/03"}],"instructors":[{"name":"Hendler,R","full_name":"Richard M. Hendler","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Business Law","sections_evaluated":9,"terms":"2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":454,"respondents":315,"response_rate":0.694,"scores":{"Goals clear":4.41,"Assignments effective":4.3,"Diverse perspectives":4.62,"Hours/week outside class":0.8300000000000001,"Instructor clear on expectations":4.51,"Instructor explains concepts":4.59,"Feedback helpful":4.34,"Inclusive environment":4.77,"Course overall":4.54,"Intellectually stimulating":4.59,"Instructor overall":4.67}}}],"notes":null}]},{"course_code":"BSPA-GB.2331","title":"Law and Business and Human Rights","units":3.0,"department":"Business and Society","schedule_department":"Business and Society","specializations":["Global Business","Law & Business","Supply Chain Management & Global Sourcing","Sustainable Business and Innovation"],"description":"Increasingly businesses are confronted with human rights challenges whether in managing global manufacturing supply chains dressing privacy issues in the Information technology industry security issues in the extractive industries or confronting child and forced labor in agriculture. Over 14 sessions this course will examine these and other issues divided into three segments The first segment will examine the origins and substantive content of international human rights standards. It will examine the implementation of these standards at a national and international level and the range of remedies when governments fail to comply with these standards.The second segment will explore the effects of globalization and the increasing imperative for global businesses to address human rights challenges in their core business operations. These issues become especially relevant in states with a weak rule of law and a lack of willingness or capacity to protect the rights of their own people. In addressing the responsibility of businesses to respect human rights we will apply a framework similar to that which we discussed in the first segment standard-setting implementation and the provision of appropriate remedies. the third segment we will take a case study approach examining how business and human rights issues manifest themselves in global manufacturing the extractive industries information and communication technology companies and in agriculture. We also will explore how the investment community is addressing these issues. Finally we will look ahead and anticipate where the field of business and human rights is headed and how corporate leaders and lawyers can help develop models of sustainability for businesses in the human rights realm.","prerequisites":["BSPA-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1799,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 6:00 pm - 9:00 pm","dates":"02/01-05/03"}],"instructors":[{"name":"Posner,M","full_name":"Michael H Posner","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Law And Business And Human Rig","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":74,"respondents":50,"response_rate":0.676,"scores":{"Goals clear":4.65,"Assignments effective":4.57,"Diverse perspectives":4.72,"Hours/week outside class":0.49000000000000005,"Instructor clear on expectations":4.85,"Instructor explains concepts":4.75,"Feedback helpful":4.71,"Inclusive environment":4.76,"Course overall":4.59,"Intellectually stimulating":4.62,"Instructor overall":4.79}}}],"notes":"This course is crosslisted with the Law School."}]},{"course_code":"BSPA-GB.3110","title":"Work, Wisdom, and Happiness","units":1.5,"department":"Business and Society","schedule_department":"Business and Society","specializations":["Sustainable Business and Innovation"],"description":"For centuries, work was regarded as nothing but toil — a requirement for earning one's daily bread. But in recent decades, expectations about work have been transformed as has its very nature. While it still provides one's daily bread, it is also regarded as a major opportunity for people to find purpose, meaning, and happiness in their lives. In this course, students study the latest research on what makes people happy at work, on how happiness at work improves the quality of work, on how people and organizations develop wisdom, and on what makes a career not just successful but meaningful. We will also discuss some of the impediments — both individual and organizational to doing meaningful and satisfying work. Students will develop their own visions of their ideal career, and of the ideal company they'd like to lead or work for.","prerequisites":["BSPA-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":1800,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 9:00 am - 11:50 am","dates":"01/26-03/23"}],"instructors":[{"name":"Dewji,M","full_name":"Mira Dewji","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Work, Wisdom, And Happiness","sections_evaluated":6,"terms":"2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolle xplains concepts":4.58,"Feedback helpful":4.2,"Inclusive environment":4.67,"Course overall":4.52,"Intellectually stimulating":4.62,"Instructor overall":4.67}}}],"notes":null}]},{"course_code":"COR1-GB.2114","title":"Operations","units":1.5,"department":"Core Courses","schedule_department":"Core Courses","specializations":[],"description":"In this course we discuss Operations as a mindset focused on execution - on the ability to get things done. Since this ability is a key to maintaining competitive edge in today's ever-changing business environment, Operations is relevant to anyone at any function of the business and at any level of the organization. The basic premise is that of managing processes, rather than individual tasks or events. This class will examine processes systematically throughout their life cycle from design to execution to continuous improvement. It will equip the students with a set of process-focused skills such as how to analyze a process, how to measure its performance, how to allocate available resources, and how to set up a process improvement program.","prerequisites":[],"sections":[{"section":"F2","class_nbr":2829,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"T 9:00 am - 11:50 am","dates":"01/26-03/23"}],"instructors":[{"name":"Mouchtaki,O","full_name":"Omar Mouchtaki","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Operations","sections_evaluated":1,"terms":"2025F","latest_term":"2025F","enrolled":49,"respondents":34,"response_rate":0.694,"scores":{"Goals clear":4.5,"Assignments effective":4.4,"Diverse perspectives":4.5,"Hours/week outside class":1.0,"Instructor clear on expectations":4.6,"Instructor explains concepts":4.6,"Feedback helpful":4.4,"Inclusive environment":4.5,"Course overall":4.4,"Intellectually stimulating":4.6,"Instructor overall":4.6}}}],"notes":"Focused MBA"}]},{"course_code":"ECON-GB.2110","title":"Health and Medical Care Business","units":1.5,"department":"Economics","schedule_department":"Economics","specializations":["Economics","Healthcare","Strategy"],"description":"This course is designed to give the student a general understanding of the economics of healthcare More specifically the course will allow students1 To understand what makes the Economics of Healthcare unique 2 To understand Healthcare Markets a Demand b Production and Costs c Supply 3 To understand the market for Healthcare Market Failure and the Role of Government 4 Health Insurance Third Party Payers and Healthcare Financing 5 Economic Evaluation in Healthcare a Equity Efficiency Ethics b CostBenefit c Measuring Value and Outcomes","prerequisites":["Prerequisite: MBA student and COR1-GB 1303. Focused MBA student and COR1-GB 1103.","Not open to students with more than 24 ECON-GB units."],"sections":[{"section":"30","class_nbr":1775,"instruction_mode":"Online","alternate_schedule":false,"meetings":[{"days_time":"M 7:00 pm - 9:00 pm","dates":"02/01-03/22"}],"instructors":[{"name":"Andrzejewski,S","full_name":"Stephen Andrzejewski","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Health & Medical Care Business","sections_evaluated":7,"terms":"2023U, 2023F, 2024S, 2024F, 2025S, 2025F, 2026S","latest_term":"2026S","enrolled":242,"respondents":172,"response_rate":0.711,"scores":{"Goals clear":4.28,"Assignments effective":4.14,"Diverse perspectives":4.48,"Hours/week outside class":0.81,"Instructor clear on expectations":4.3,"Instructor explains concepts":4.23,"Feedback helpful":4.05,"Inclusive environment":4.44,"Course overall":4.17,"Intellectually stimulating":4.26,"Instructor overall":4.24}}}],"notes":"Online; This class will have additional asynchronous work each week."}]},{"course_code":"ECON-GB.2112","title":"Economics and Management of the Pharmaceutical","units":1.5,"department":"Economics","schedule_department":"Economics","specializations":["Economics","Healthcare","Strategy"],"description":"This course offers the student an overview of the management economics and policy issues that drive and challenge the pharmaceutical and biotechnology industries Included also in the biotechnology heading will be the multidisciplinary medical device industry. The focus of this course is to give the student insight into these important health care industries and their business transformation in an environment of health care reform. The objectives of the course will include an understanding of the cost structure of these important market sectors a focus on the management and economics of the powerful RD process and its relationship to an ever changing technological environment and innovation dominance the explosive growth of the biologic and genomics markets and the interconnectivity of the pharmaceutical and biotechnology industries. Discussion will also include the role of government regulation on these industries. The course will highlight the role of these industries in a global marketplace.","prerequisites":["ECON-GB Departmental Max and Non-Stern"],"sections":[{"section":"S1","class_nbr":1776,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"FSaSu 9:00 am - 4:00 pm","dates":"04/30-05/02"}],"instructors":[{"name":"Liotta,D","full_name":"Dennis Liotta","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Econ & Mgmt Of Pharmaceutical","sections_evaluated":4,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":153,"respondents":109,"response_rate":0.712,"scores":{"Goals clear":4.58,"Assignments effective":4.44,"Diverse perspectives":4.6,"Hours/week outside class":0.5900000000000001,"Instructor clear on expectations":4.72,"Instructor explains concepts":4.59,"Feedback helpful":4.46,"Inclusive environment":4.56,"Course overall":4.63,"Intellectually stimulating":4.6,"Instructor overall":4.73}}}],"notes":null}]},{"course_code":"ECON-GB.2355","title":"Behavioral Economics: Decisions and Strategies","units":3.0,"department":"Economics","schedule_department":"Economics","specializations":["Economics","Management","Strategy"],"description":"Behavioral economics is an emerging subfield that integrates insights from psychology into economic models of behavior. This MBA elective course is intended to inform managers analysts and consultants of the psychological processes and biases underlying our decision making with an emphasis on how to incorporate such insights into business strategies. Successful business strategies depend on a thorough understanding of how consumers and producers make decisions. However traditional models which are founded on the assumption of perfect rationality have serious limitations. Rather than making decisions in the manner predicted by these models consumers and producers often use myriad rules and processes that result in sometimes counterintuitive decisions. For instance consumers have an exaggerated tendency to select compromise or middle options when making choices overpay for warranties buy products they do not use and do not buy products that they later wish they had. Similarly producers overpay for acquisitions persist in investing in losing projects hire the wrong people and design products that result in consumer dissatisfaction. The fact many of these decision errors and biases are systematic has powerful business implications because as this course illustrates it is possible to address them. This course will provide a broad overview of important results from behavioral economics that clarify how consumers and producers really make decisions and investigate how these results can be leveraged to design original and more effective business strategies.","prerequisites":["Prerequisite: MBA student and COR1-GB 1303. Focused MBA student and COR1-GB 1103.","Not open to students with more than 24 ECON-GB units."],"sections":[{"section":"20","class_nbr":1777,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"TR 10:30 am - 11:50 am","dates":"01/26-05/04"}],"instructors":[{"name":"Bowmaker,S","full_name":"Simon Bowmaker","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Behavioral Economics: Decision","sections_evaluated":11,"terms":"2023U, 2024S, 2024U, 2025S, 2025U, 2025F, 2026S, 2026U","latest_term":"2026U","enrolled":620,"respondents":463,"response_rate":0.747,"scores":{"Goals clear":4.68,"Assignments effective":4.47,"Diverse perspectives":4.6,"Hours/week outside class":0.56,"Instructor clear on expectations":4.74,"Instructor explains concepts":4.64,"Feedback helpful":4.3,"Inclusive environment":4.66,"Course overall":4.61,"Intellectually stimulating":4.66,"Instructor overall":4.69}}}],"notes":null}]},{"course_code":"ECON-GB.2360","title":"Sports Economics","units":3.0,"department":"Economics","schedule_department":"Economics","specializations":["Economics","Entertainment, Media & Technology","Global Business","Strategy"],"description":"This course applies microeconomic theory and econometric analysis to sport and it explores some public policy issues that have arisen in the design of sports competitions. In addition it applies the tools of behavioral finance to sports betting markets. This is a unique opportunity to understand why there has been a recent explosion in economists looking both at the market of sports and using sports data to explain or to test theories about the wider business world. The course is divided into four main parts: The Structure of Sports Leagues, Labor Market Issues, College Sports and the Market for Sports Betting. By the end of the course students will be able to comment intelligently on the economic issues of sport which regularly appear in the news media and they will be able to offer insights into the parallels between betting on the ball game gambling at the ponies and purchasing stock in a favorite firm on the NYSE.","prerequisites":["Prerequisite: MBA student and COR1-GB 1303. Focused MBA student and COR1-GB 1103.","Not open to students with more than 24 ECON-GB units."],"sections":[{"section":"20","class_nbr":1779,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 1:30 pm - 2:50 pm","dates":"01/25-05/03"}],"instructors":[{"name":"Bowmaker,S","full_name":"Simon Bowmaker","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Sports Economics","sections_evaluated":10,"terms":"2023U, 2024S, 2024U, 2025S, 2025U, 2026S, 2026U","latest_term":"2026U","enrolled":499,"respondents":376,"response_rate":0.754,"scores":{"Goals clear":4.73,"Assignments effective":4.55,"Diverse perspectives":4.68,"Hours/week outside class":0.5,"Instructor clear on expectations":4.79,"Instructor explains concepts":4.74,"Feedback helpful":4.45,"Inclusive environment":4.73,"Course overall":4.71,"Intellectually stimulating":4.67,"Instructor overall":4.78}}}],"notes":null}]},{"course_code":"ECON-GB.2374","title":"Healthcare Markets","units":3.0,"department":"Economics","schedule_department":"Economics","specializations":["Economics","Healthcare"],"description":"In this course, we will apply the tools of economic analysis to study how medical care is produced and financed, in both the private and public sectors. Our emphasis will be on the United States, with a brief treatment of health systems in other developed and less developed countries.","prerequisites":["ECON-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":19106,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"MW 9:00 am - 10:20 am","dates":"01/25-05/03"}],"instructors":[{"name":"Dickstein,M","full_name":"Michael Dickstein","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Healthcare Markets","sections_evaluated":4,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":127,"respondents":80,"response_rate":0.63,"scores":{"Goals clear":4.87,"Assignments effective":4.72,"Diverse perspectives":4.79,"Hours/week outside class":1.08,"Instructor clear on expectations":4.89,"Instructor explains concepts":4.86,"Feedback helpful":4.78,"Inclusive environment":4.91,"Course overall":4.84,"Intellectually stimulating":4.91,"Instructor overall":4.94}}}],"notes":null}]},{"course_code":"ECON-GB.3150","title":"The Economics of AI","units":1.5,"department":"Economics","schedule_department":"Economics","specializations":["Artificial Intelligence","Economics"],"description":"This course examines the economics of artificial intelligence and technological change. Rather than focusing on how to use AI directly, the course explores AI's likely economic impact by drawing on lessons from past periods of transformative technological change, including electrification, railroads, aviation, computers, and the Internet. The course addresses several core questions. First, it considers why even powerful new technologies historically took decades to achieve widespread adoption and measurable productivity gains, and what this implies for AI's trajectory. Second, it examines the distinction between value creation and value capture, asking which layers of the AI value chain — from chip makers to foundation models to enterprise applications — are likely to earn sustained returns. Third, the course analyzes AI's impact on labor markets, exploring whether AI will primarily augment or automate workers across different occupations and skill levels, and how to think about jobs in terms of tasks rather than roles. Fourth, it investigates the macroeconomic productivity puzzle: why firm-level efficiency gains from AI may take years to appear in aggregate data, and whether AI will ultimately prove inflationary or deflationary. Fifth, the course explores the intersection of AI with the broader electrification revolution and the global competition to lead in semiconductors, clean energy, and AI infrastructure. Finally, it examines the political and regulatory responses that technological revolutions inevitably provoke, from historical antitrust movements to contemporary debates over autonomous vehicles and AI governance. Students engage with academic research, policy analysis, and journalism, and develop their analytical skills through memo assignments, a group presentation, class discussion, and a final paper.","prerequisites":["Prerequisite: MBA student and COR1-GB 1303. Focused MBA student and COR1-GB 1103.","Not open to students with more than 24 ECON-GB units."],"sections":[{"section":"30","class_nbr":19334,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 6:00 pm - 9:00 pm","dates":"03/29-05/03"}],"instructors":[{"name":"Foudy,J","full_name":"Joseph Foudy","full_name_source":"web (NYU Stern site)","name_source":"schedule","evaluation_2023_2026":null}],"notes":null}]},{"course_code":"FINC-GB.2190","title":"Currency Crashes in Emerging Markets","units":1.5,"department":"Finance","schedule_department":"Finance","specializations":["Finance","Global Business"],"description":"The six-session course focuses on understanding the causes, dynamics and consequences of notable currency crises that have occurred in Emerging Markets countries over the last three decades. These economies have been particularly susceptible to significant currency volatility over the years, especially as their capital markets have increasingly opened to global investors.","prerequisites":["Prerequisite: Full-time MBA Student and COR1-GB 2311. Focused MBA Student and COR1-GB 2222. Part-time MBA Student and COR1-GB 2311 or COR1-GB 2302.","FINC-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":2121,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"02/04-03/11"}], ls by examining a series of landmark and potential corporate transactions in telecom, media & technology industries to understand how TMT companies respond to secular changes and transform their business models in the midst of evolving ecosystems. Cases discussed/analyzed include: CBS vs. Viacom; NFL's Digital Media Initiatives; AT&T, DirecTV and Time Warner; Tesla; Alphabet vs. Apple; Amazon Web Services, Twitch, Waymo and Instagram.","prerequisites":["Pre-req: Full-time MBA, COR1-GB 2311. Co-requisite: FINC-GB 2302.","Pre-req: Focused MBA and COR1-GB 2222.","Pre-req: Part-time MBA, (COR1-GB 2311). Co-requisite: (FINC-GB 2302).","Not open to students with 24 or more FINC-GB units."],"sections":[{"section":"30","class_nbr":7664,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"02/04-03/11"}],"instructors":[{"name":"Cha,T","full_name":"Thomas Cha","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Fin Analysis Telemedia & Tech","sections_evaluated":3,"terms":"2023F, 2025S, 2025F","latest_term":"2025F","enrolled":101,"respondents":63,"response_rate":0.624,"scores":{"Goals clear":4.26,"Assignments effective":3.87,"Diverse perspectives":4.28,"Hours/week outside class":0.53,"Instructor clear on expectations":4.3,"Instructor explains concepts":4.18,"Feedback helpful":3.93,"Inclusive environment":4.44,"Course overall":4.08,"Intellectually stimulating":4.12,"Instructor overall":4.19}}}],"notes":null}]},{"course_code":"FINC-GB.3129","title":"Behavioral and Experimental Finance","units":1.5,"department":"Finance","schedule_department":"Finance","specializations":["Banking","Corporate Finance","Economics","Finance","Financial Instruments & Markets","Quantitative Finance"],"description":"Finance theory has long relied on a descriptively sparse model of behavior based on the premise that investors and managers are rational Another critical assumption is that misjudgments by investors and managers are penalized swiftly in competitive markets In recent years both assumptions have been questioned as the standard model fails to account for various aspects of actual markets Behavioral finance which allows that investors and managers are not always rational and may make systematic errors of judgment that affect market prices has emerged as a credible alternative to the standard model This course provides an exposition of the insights and implications of behavioral finance theory showing how it can explain otherwise puzzling features of asset prices and corporate finance Notwithstanding the inroads of the new theory the standard model retains strong support amongst many academics practitioners who make criticisms of behavioral finance that deserve serious consideration An important challenge that we will address in this course is identifying the respective domains of each perspective and whether there are tradable opportunities","prerequisites":["Prerequisite: Full-time MBA Student and COR1-GB 2311. Focused MBA Student and COR1-GB 2222. Part-time MBA Student and COR1-GB 2311 or COR1-GB 2302.","FINC-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":2125,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"R 6:00 pm - 9:00 pm","dates":"02/04-03/11"}],"instructors":[{"name":"D'Souza,I","full_name":"Ian C. D'Souza","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Behavioral & Experimental Finc","sections_evaluated":7,"terms":"2023U, 2024S, 2024U, 2025S, 2025U, 2026S, 2026U","latest_term":"2026U","enrolled":310,"respondents":250,"response_rate":0.806,"scores":{"Goals clear":4.76,"Assignments effective":4.54,"Diverse perspectives":4.64,"Hours/week outside class":0.9700000000000001,"Instructor clear on expectations":4.81,"Instructor explains concepts":4.8,"Feedback helpful":4.37,"Inclusive environment": 27 Travel dates: 3/14/2027 - 3/20/2027"}]},{"course_code":"INTA-GB.2000","title":"Professional Practicum","units":1.0,"department":"Inter-Area","schedule_department":"Inter-Area","specializations":[],"description":"The purpose of this course is to provide students with a final-term opportunity to reflect on the link between the core foundational concepts of the program and their real-world application. The course consists of two parts: selecting a personalized experience that will require the student to apply the skills and knowledge they have been developing, and then reflecting (in written form) on how this interrelationship and their growth as leaders and professionals. This course counts towards the completion of the Focused MBA program, but it does not count towards any MBA specialization. Students will not be charged tuition for this 1.0 credit course. This is a required class for the completion of the program and must be taken in the final term.","prerequisites":[],"sections":[{"section":"F3","class_nbr":3100,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":null,"dates":"01/25-05/04"}],"instructors":[{"name":"TBA","full_name":null,"full_name_source":null,"evaluation_2023_2026":null}],"notes":"Focused MBA"}]},{"course_code":"INTA-GB.2306","title":"Business Drivers: An Analytical Framework","units":3.0,"department":"Inter-Area","schedule_department":"Inter-Area","specializations":["Accounting","Strategy"],"description":"Visit http://www.dangode.com/drivers/ for details. Specialization: Strategy and Accounting. We illustrate a streamlined and structured framework to analyze business drivers of companies from a wide range of industries, except financial services. This helps us understand their narrative, drill into their financial statements, and assess competitive advantage. The analysis proceeds as follows: (1) We apply the Six-Pack Framework for a top-down and comprehensive analysis of financial statements to extract the six key inputs into valuation - Size, Growth, Margins, Asset intensity, Business risk, and Financial risk. (2) We analyze how these inputs depend upon a company's strategy by computing the Competitive Advantage Score that assigns weights to competitive drivers and scores the company's strength on those drivers. This broad exposure will expand your strategic horizons and enable you to foresee challenges and opportunities due to changing competition, technology, and environment. The framework and the perspective will sharpen your ability to lead value creation as an entrepreneur or executive, or to understand value creation as an investor, banker, analyst, or consultant.","prerequisites":["Prerequisite: INTA-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1790,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"W 6:00 pm - 9:00 pm","dates":"02/03-04/28"}],"instructors":[{"name":"Gode,D","full_name":"Dhananjay Gode","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Business Drivers","sections_evaluated":10,"terms":"2023U, 2023F, 2024S, 2024U, 2024F, 2025S, 2025U, 2025F, 2026S, 2026U","latest_term":"2026U","enrolled":395,"respondents":242,"response_rate":0.613,"scores":{"Goals clear":4.2,"Assignments effective":4.19,"Diverse perspectives":4.02,"Hours/week outside class":1.4,"Instructor clear on expectations":4.21,"Instructor explains concepts":4.22,"Feedback helpful":3.62,"Inclusive environment":4.24,"Course overall":4.07,"Intellectually stimulating":4.25,"Instructor overall":4.18}}}],"notes":null}]},{"course_code":"INTA-GB.2307","title":"Tech Industry Drivers: An Analytical Framework","units":3.0,"department":"Inter-Area","schedule_department":"Inter-Area","specializations":["Accounting","Brand Management","Entertainment, Media & Technology","Management of Technology & Operations","Strategy","Tech Product Management"],"description":"Visit http://www.dangode.com/techdrivers/ for details. Specializations: Strategy, Product Management, Entertainment, Media, and Technology (EMT), Management of Technology Operations, and Accounting. This course and the Business Drivers course use the same analytical framework (about 25% of the course). However, this course focuses only on tech companies. Some students have taken both courses and found them to be valuable. We illustrate a streamlined and structured framework to analyze business drivers of forty tech companies. This helps us understand their narrative, drill into their financial statements, and assess competitive advantage. The analysis proceeds as follows: (1) We apply the Six-Pack Framework for a top-down and comprehensive analysis of financial statements to extract the six key inputs into valuation — Size, Growth, Margins, Asset intensity, Business risk, and Financial risk. (2) We analyze how these inputs depend upon a company's strategy by computing the Competitive Advantage Score that assigns weights to competitive drivers and scores the company's strength on those drivers. This broad exposure will expand your tech horizons and enable you to foresee challenges and opportunities due to changing competition, technology, and environment. The framework and the perspective will sharpen your ability to lead value creation as a tech entrepreneur or executive, or to understand value creation as an investor, banker, analyst, or consultant.","prerequisites":["Prerequisite: INTA-GB Departmental Max and Non-Stern"],"sections":[{"section":"30","class_nbr":1791,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"M 6:00 pm - 9:00 pm","dates":"02/01-05/03"}],"instructors":[{"name":"Gode,D","full_name":"Dhananjay Gode","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Tech Industry Drivers","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":50,"respondents":26,"response_rate":0.52,"scores":{"Goals clear":3.84,"Assignments effective":4.08,"Diverse perspectives":3.92,"Hours/week outside class":1.18,"Instructor clear on expectations":4.0,"Instructor explains concepts":4.07,"Feedback helpful":3.78,"Inclusive environment":4.2,"Course overall":4.01,"Intellectually stimulating":4.13,"Instructor overall":4.01}}}],"notes":null}]},{"course_code":"INTA-GB.2380","title":"Foundations of Fintech","units":3.0,"department":"Inter-Area","schedule_department":"Inter-Area","specializations":["FinTech","Finance","Tech Product Management"],"description":"\"FinTech\" refers to financial sector innovations involving technology- enabled business models that can facilitate disintermediation, revolutionize how existing firms create and deliver products and services, address privacy, regulatory and law-enforcement challenges, provide new gateways for entrepreneurship, and seed opportunities for inclusive growth. FinTech is also the label for increasingly technological approaches to the main financial intermediation functions: payments, capital raising, remittances, managing uncertainty and risk, market price discovery, and mediating information asymmetry and incentives. In today's FinTech businesses, consumers bank via mobile apps integrated into social media, institutions trade electronically, and robo-advisers make decisions about investment portfolios. This inter-departmental course provides an introduction to the emerging FinTech discipline. It is intended to be the starting point for Stern students who may take additional electives in the FinTech area, while also providing an overview of the area for students who intend to take only one FinTech course. The course will study: • How is financial innovation different than industrial innovation? How is financial innovation evolving? What are the light sides and dark sides of financial innovation? • Will traditional financial intermediaries be able to adapt? Or will upstart FinTechs disrupt them, re-imagining business models just as Amazon reshaped book-selling and Uber transformed taxi-rides? • What are the critical technology strategies and foundational technologies in FinTech? • What are the core and novel sources of FinTech data, how are they managed? How is data visualization evolving? • What are the primary FinTech data science methods and tools? How do they apply to real FinTech problems and questions today? • How is FinTech reconfiguring financial services business models? What are the key disruption points? What determines success in FinTech? • Where are the limits, risks, and broader policy and social implications of FinTech?","prerequisites":["Prerequisite: INTA-GB Departmental Max and Non-Stern"],"sections":[{"section":"20","class_nbr":2047,"instruction_mode":"In-Person","alternate_schedule":false,"meetings":[{"days_time":"TR 9:00 am - 10:20 am","dates":"01/26-05/04"}],"instructors":[{"name":"De Rose,K","full_name":"Kathleen DeRose","full_name_source":"web (NYU Stern site)","name_source":"schedule","evaluation_2023_2026":null},{"name":"Marti,C","full_name":"Chitra Marti","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Foundations Of Fintech","sections_evaluated":1,"terms":"2026S","latest_term":"2026S","enrolled":36,"respondents":23,"response_rate":0.639,"scores":{"Goals clear":4.3,"Assignments effective":3.9,"Diverse perspectives":4.6,"Hours/week outside class":1.0,"Instructor clear on expectations":4.0,"Instructor explains concepts":3.7,"Feedback helpful":3.7,"Inclusive environment":4.6,"Course overall":4.0,"Intellectually stimulating":4.3,"Instructor overall":4.0}}}],"notes":null}]},{"course_code":"INTA-GB.3130","title":"Leadership Fellows","units":1.5,"department":"Inter-Area","schedule_department":"Inter-Area","specializations":["Leadership and Change Management","Management"],"description":"Becoming a better leader is not a passive process. Adults learn far more through experience -- through acting and reflecting -- than they learn from the advice of others. As such, the Leadership Fellows curriculum is heavily focused on practice. Fellows will practice working through difficult workplace scenarios with professional role players, be given the opportunity to reflect on their behavior, and provide / receive feedback from their cohort members. Further, they will be afforded the opportunity to test their learning by repeating the experience. The purpose of this practice is to position students as leaders within their organizations after Stern. By practicing and experiencing the emotions and rushing thoughts that arise under pressure, students will rise to the occasion, carry themselves with greater confidence and purpose, and be seen as people who are seasoned beyond their years.","prerequisites":["Prerequisite: INTA-GB Departmental Max and Non-Stern"],"sections":[{"section":"21","class_nbr":1995,"instruction_mode":"In-Person","alternate_schedule":true,"meetings":[{"days_time":"F 10:00 am - 4:00 pm","dates":"02/26-02/26"},{"days_time":"F 10:00 am - 4:00 pm","dates":"03/26-03/26"},{"days_time":"F 10:00 am - 4:00 pm","dates":"04/16-04/16"},{"days_time":"F 10:00 am - 4:00 pm","dates":"04/30-04/30"}],"instructors":[{"name":"Hsieh,J","full_name":"Jessy Y Hsieh","full_name_source":"evaluations (same course)","name_source":"schedule","evaluation_2023_2026":{"eval_course_title":"Leadership Fellows","sections_evaluated":3,"terms":"2024S, 2025S, 2026S","latest_term":"2026S","enrolled":36,"respondents":21,"response_rate":0.583,"scores":{"Goals clear":4.56,"Assignments effective":4.4,"Diverse perspectives":4.7,"Hours/week outside class":0.04,"Instructor clear on expectations":4.5,"Instructor explains concepts":4.39,"Feedback helpful":4.48,"Inclusive environment":4.82,"Course overall":4.32,"Intellectually stimulating":4.26,"Instructor overall":4.43}}}],"notes":"Only offered to students enrolled in Fall 2026 Leadership Fellows course To dr
